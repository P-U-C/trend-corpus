id: ths_pc_nvidia_anchored_cpo_buildout
title: Photonic computing is a hyperscaler-anchored CPO buildout with private and acquired chiplet platforms setting the next evidence clock
summary: >
  Photonic computing splits across three layers. The first is hyperscaler-
  anchored demand: NVIDIA's March 2, 2026 $4B commitment split equally
  between Lumentum and Coherent (investment, multibillion purchase
  commitments, future capacity / access rights, U.S. manufacturing support)
  converts the long-running industrial-research thesis into a
  production-revenue catalyst without requiring an unsupported "largest ever"
  claim. Lumentum fiscal Q3 2026 revenue $808.4M (+90 percent YoY), its
  Q2 $400M-plus OCS backlog baseline, and Coherent fiscal Q3 2026 revenue
  $1.806B (+21 percent YoY) confirm that the optics cohort is repricing on
  AI-datacenter pacing rather than legacy telecom pacing. The second is
  chiplet validation: Lightmatter at $850M total raised and $4.4B valuation
  with Passage L200 / L200x above 200 Tbps, Ayar Labs at $870M total raised
  after a $500M Series E in March 2026, Marvell folding Celestial AI
  Photonic Fabric into the public MRVL stack, and Salience Labs / Tower
  pushing OCS toward pre-production. Private and acquired platform milestones
  may lead public revenue inflection, but the 12-24-month lead is a
  watchlist hypothesis. The third is upstream supply: TSMC COUPE and
  CoWoS-class packaging, GF SCALE, Tower silicon-photonics platforms, InP
  wafer and DFB / VCSEL laser availability, and the U.S.-fab support
  component of the NVIDIA commitment. The useful watchlist combines (a) LITE
  / COHR quarterly revenue and OCS backlog cadence, (b) AAOI / POET / Aeluma
  ramp evidence, (c) Lightmatter / Ayar Labs / Salience / Marvell-Celestial
  product disclosures, (d) TSMC / GF / Tower public CPO milestones, and (e)
  hyperscaler design-in language at OFC and subsequent quarterly calls.
