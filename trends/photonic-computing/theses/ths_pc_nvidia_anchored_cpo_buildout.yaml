id: ths_pc_nvidia_anchored_cpo_buildout
title: Photonic computing is a hyperscaler-anchored CPO buildout with private chiplet keystones leading the public revaluation by 12-24 months
summary: >
  Photonic computing splits across three layers. The first is hyperscaler-
  anchored demand: NVIDIA's March 2026 $4B commitment split equally between
  Lumentum and Coherent (equity, multibillion purchase commitments, future
  capacity access, U.S. fab support) is the largest single strategic
  commitment to silicon photonics ever announced and converts the long-
  running industrial-research thesis into a production-revenue catalyst.
  Lumentum fiscal Q2 2026 revenue $665.5M (+66 percent YoY) and Coherent
  fiscal Q3 2026 revenue $1.806B (+21 percent YoY) confirm that the optics
  cohort is repricing on AI-datacenter pacing rather than legacy telecom
  pacing. The second is private-chiplet validation: Lightmatter at ~$822M
  total at $4.4B valuation with Passage L200 / L200x above 200 Tbps,
  Ayar Labs at ~$870M total raised after a $500M Series E in March 2026,
  Celestial AI extending Photonic Fabric to memory disaggregation. Private
  marks lead public revenue inflection by 12-24 months and constitute the
  leading catalyst clock. The third is upstream supply: TSMC CoWoS-class
  packaging and silicon-photonic line capacity, InP wafer and DFB / VCSEL
  laser availability, and the U.S.-fab support component of the NVIDIA
  commitment. The useful watchlist combines (a) LITE / COHR quarterly
  revenue and OCS backlog cadence, (b) AAOI and POET ramp evidence,
  (c) Lightmatter / Ayar Labs / Celestial AI fundraise and product
  disclosures, (d) TSMC capex guidance for the photonic mix, and (e)
  hyperscaler design-in language at OFC and subsequent quarterly calls.
