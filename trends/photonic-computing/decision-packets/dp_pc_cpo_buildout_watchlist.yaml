id: dp_pc_cpo_buildout_watchlist
question: Should the metalayer maintain a watchlist of optics-prime cohort (LITE, COHR) plus smaller-cap pure-plays (AAOI, MACOM, POET, nLight, Aeluma) plus DSP / CPO platform layer (MRVL, AVGO) plus private and acquired chiplet keystones (Lightmatter, Ayar Labs, Salience Labs, Celestial AI inside Marvell) plus TSMC / GF / Tower photonic-capacity anchors, tracked against NVIDIA commitment burn cadence, OCS backlog, and OFC design-in disclosures?
verdict: watchlist_candidate
execution_state: human_review_required
supporting_theses:
  - ths_pc_nvidia_anchored_cpo_buildout
supporting_claims:
  - clm_pc_nvidia_anchor_investment
  - clm_pc_revenue_inflection
  - clm_pc_private_chiplet_validation
invalidation_conditions:
  - NVIDIA, Lumentum, or Coherent publicly reduces or restructures the March 2, 2026 $4B commitment in a newsroom release, 8-K, 10-Q, or earnings-call disclosure, breaking the hyperscaler-anchored demand catalyst that the optics revaluation rests on.
  - LITE or COHR misses one quarter of guidance on hyperscaler optical revenue or OCS backlog conversion by more than 25 percent, eliminating the revenue-inflection case.
  - A non-photonic interconnect alternative (advanced copper, in-package electrical fabric, optical engines built in-house by hyperscalers) wins material design-in slots away from LITE / COHR / AAOI / Lightmatter / Ayar at a 2026-2027 OFC equivalent, fragmenting the addressable market.
  - TSMC, GF, Tower, or a named ecosystem partner discloses a slip in COUPE / SCALE / silicon-photonic CPO qualification, pre-production, or high-volume manufacturing milestones; or TSMC reports CoWoS-class advanced-packaging capacity is no longer tight for AI/HPC customers, changing the supply-ramp and pricing-power premise.
  - A second mega-cap strategic acquirer (AVGO, AMD, AMZN) takes Lightmatter, Ayar Labs, or Salience Labs out at a control premium below current private-market marks, signaling that strategic value tops out below standalone-platform expectations.
schema_version: 1
