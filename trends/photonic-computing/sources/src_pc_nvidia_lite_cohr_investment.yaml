notes: >
  NVIDIA March 2, 2026 Coherent release and companion Lumentum release
  covering two $2B strategic agreements. The Coherent agreement includes a
  multibillion-dollar purchase commitment, future access / capacity rights,
  and U.S. manufacturing support; the Lumentum agreement includes a
  multibillion advanced-laser purchase commitment, future capacity access
  rights, and support for a new U.S. fab.
