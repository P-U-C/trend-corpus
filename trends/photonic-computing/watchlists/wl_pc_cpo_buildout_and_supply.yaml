id: wl_pc_cpo_buildout_and_supply
title: Photonic-computing CPO buildout and supply watchlist
monitor_for:
  - Lumentum quarterly revenue, OCS backlog ($400M-plus baseline), NVIDIA purchase-commitment burn cadence, and U.S. fab build progress
  - Coherent quarterly revenue, NVIDIA $2B integration milestones, OFC 2026 product launches, and the cross-segment laser / networking mix
  - Applied Optoelectronics CPO shipment ramp, hyperscaler transceiver mix, and CATV residual revenue
  - MACOM InP and photonic-subassembly book-to-bill and POET Technologies 1.6T optical-engine sampling cadence
  - nLight semiconductor-laser shipments and directed-energy program disclosures
  - Marvell optical DSP shipment trajectory plus OFC 2026 and earnings call optical-revenue split
  - Lightmatter Passage L200 / L200x customer disclosures and any commercial-billings or partnership news
  - Ayar Labs TeraPHY / SuperNova customer ramp and any 2026 commercial-billings or design-in announcement
  - Celestial AI Photonic Fabric customer disclosures and follow-on fundraise marks
  - TSMC CoWoS-class capacity guidance and silicon-photonic line allocation share-of-capacity
  - U.S. DOC / BIS notices on advanced-laser export controls and CHIPS Act Title 17 awards touching photonic-fab supply
  - OFC 2026 keynote and technical-program announcements that signal hyperscaler design-in language
schema_version: 1
