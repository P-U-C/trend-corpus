id: wl_pc_cpo_buildout_and_supply
title: Photonic-computing CPO buildout and supply watchlist
monitor_for:
  - Lumentum quarterly revenue ($808.4M Q3 FY2026 baseline), OCS backlog ($400M-plus Q2 baseline), NVIDIA purchase-commitment burn cadence, and U.S. fab build progress
  - Coherent quarterly revenue ($1.806B Q3 FY2026 baseline), NVIDIA $2B integration milestones, OFC product launches, and the cross-segment laser / networking mix
  - Applied Optoelectronics CPO shipment ramp, hyperscaler transceiver mix, CATV residual revenue, and optics-trade volatility after the May 11, 2026 24 percent rally
  - MACOM InP and photonic-subassembly book-to-bill, POET Technologies 1.6T optical-engine sampling cadence, and Aeluma quantum-dot laser / silicon-photonics partner milestones
  - nLight semiconductor-laser shipments and directed-energy program disclosures
  - Marvell optical DSP shipment trajectory, Celestial AI Photonic Fabric integration, Polariton optical-modulator roadmap, and earnings-call optical-revenue split
  - Broadcom Tomahawk 6 / Davisson CPO, 400G-per-lane optical DSP, and OCI MSA updates as a large-cap platform comparator
  - Lightmatter Passage L200 / L200x customer disclosures and any commercial-billings or partnership news
  - Ayar Labs TeraPHY / SuperNova customer ramp, Hsinchu / TSMC ecosystem progress, and any 2026-2028 commercial-billings or design-in announcement
  - Salience Labs optical switch customer disclosures, Tower pre-production progress, and Keysight test-environment validation
  - TSMC COUPE qualification / CoWoS-class capacity guidance, GF SCALE CPO platform progress, and Tower silicon-photonics volume-manufacturing disclosures; do not assume line allocation share unless disclosed directly
  - U.S. DOC / BIS notices on advanced-laser export controls and CHIPS Act Title 17 awards touching photonic-fab supply
  - OFC 2026 keynote and technical-program announcements that signal hyperscaler design-in language
schema_version: 1
