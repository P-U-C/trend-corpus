summary: >
  Tracks public-market exposure to silicon photonics and the optical
  compute-and-interconnect transition. Includes the AI-datacenter optics
  primes that now host multibillion-dollar NVIDIA strategic investments
  (Lumentum, Coherent), the smaller-cap pure-play optical-transceiver
  and InP and Si-photonic suppliers (Applied Optoelectronics, MACOM,
  nLight, POET Technologies, Aeluma), the optical-interconnect DSP and
  CPO platform layer (Marvell, Broadcom), the private photonic-compute
  and optical-I/O cohort whose fundraise marks gate the public
  revaluation (Lightmatter, Ayar Labs, Salience Labs), and the foundry
  and packaging suppliers whose CoWoS, COUPE, silicon-photonic, and CPO
  module capacity gates every program (TSMC, GlobalFoundries, Tower
  Semiconductor, NVIDIA as photonic-customer-and-investor). The theme is
  growing because NVIDIA's $4B split investment in LITE and COHR
  (announced March 2026), Ayar Labs' $500M Series E (March 2026), and
  Marvell's completed Celestial AI acquisition moved photonic
  interconnect from research narrative toward production gating at
  hyperscaler scale on a 2026-2028 horizon.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain non-public
  hyperscaler purchase-order detail, proprietary fab process recipes,
  non-public TSMC silicon-photonic line capacity terms, non-public
  CoWoS allocation, BIS export-control non-public information, non-public
  order intent, account details, or non-public M&A terms.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
