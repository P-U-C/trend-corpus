id: clm_pc_nvidia_anchor_investment
claim: >
  NVIDIA's March 2, 2026 $4B strategic commitment split equally between
  Lumentum and Coherent includes $2B of investment in each company,
  multibillion-dollar advanced-laser or optical-networking purchase
  commitments, future capacity / access rights, and U.S. manufacturing
  support. It is one of the largest public, customer-anchored
  silicon-photonics commitments, but the "largest ever" framing is not
  independently provable across prior internal hyperscaler, Intel, or
  foundry programs. The discrete catalyst is the conversion of
  purchase-commitment language into reported revenue, OCS backlog
  conversion, and pluggable / CPO design wins.
