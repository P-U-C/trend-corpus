claim: "IEEE Photonics Society reported on July 20, 2026 that a Journal of Lightwave Technology study published April 30, 2026 by Ye Chen et al. identifies micro-transfer printing as a heterogeneous-integration method for silicon photonics. The study describes MTP as fabricating thin-film device coupons on a source wafer, releasing them by sacrificial-layer etching, transferring them with an elastomeric stamp to a target wafer, and securing them by adhesive or direct bonding."
