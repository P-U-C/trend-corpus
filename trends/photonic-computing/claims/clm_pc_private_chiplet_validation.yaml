id: clm_pc_private_chiplet_validation
claim: >
  The private and recently acquired chiplet cohort crossed
  commercialization milestones that validate the optical-I/O integration
  thesis. Lightmatter raised $400M in October 2024 at a $4.4B valuation,
  bringing total capital raised to $850M, and later announced Passage
  L200 / L200x optical I/O above 200 Tbps total bandwidth with an 8x
  training-time claim for advanced AI models. Ayar Labs raised a $500M
  Series E on March 3, 2026, bringing total funding to $870M at a $3.75B
  valuation, and says its CPO solution is progressing toward
  high-volume manufacturing by 2028. Marvell completed the Celestial AI
  acquisition on February 2, 2026 and expects Celestial-derived revenue
  to begin in the second half of fiscal 2028, reaching a $500M
  annualized run rate in Q4 FY2028 and $1B in Q4 FY2029. Salience Labs
  launched a 32-port all-optical silicon-photonic switch and partnered
  with Tower to move OCS manufacturing toward pre-production. The
  12-24-month lead from private or acquired platform milestones to public
  revenue inflection is a watchlist hypothesis, not a settled fact.
