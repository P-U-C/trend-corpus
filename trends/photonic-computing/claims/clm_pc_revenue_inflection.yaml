id: clm_pc_revenue_inflection
claim: >
  Public optical names crossed material revenue inflections that align
  with hyperscaler AI-buildout pacing. Lumentum reported fiscal Q3 2026
  revenue of $808.4M, up 90 percent year over year, after fiscal Q2 2026
  revenue of $665.5M and a $400M-plus Optical Circuit Switch backlog
  baseline. Coherent reported fiscal Q3 2026 revenue of $1.806B, up
  approximately 21 percent year over year. Applied Optoelectronics
  rallied 24 percent in a single trading day on May 11, 2026 as the
  optics trade rotated. LITE and COHR had rallied materially YTD by
  mid-May 2026, but exact YTD percentages should be date-stamped rather
  than carried as durable evidence.
