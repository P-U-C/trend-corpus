claim: "MACOM Technology Solutions Inc. announced on September 15, 2026 that it would demonstrate optical and high-speed connectivity technologies at ECOC 2026 in M\u00e1laga, Spain on September 21-23, 2026. The announced demonstrations include 3.2T optical solutions using 448 Gbps/lane modulator drivers, transimpedance amplifiers and photodetectors; 1.6T active copper cable and optical products using 224 Gbps/lane components; PCIe 6.0 optical and PCIe 7.0 copper connectivity; near packaged optics using 112 and 226 Gbps/lane components; 800G scale-out coherent networking; and 5G Advanced and 6G fronthaul linear drivers and TIAs."
