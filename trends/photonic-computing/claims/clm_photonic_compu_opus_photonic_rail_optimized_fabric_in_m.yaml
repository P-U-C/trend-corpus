claim: "In the ACM SIGCOMM 2026 paper published on August 11, 2026, Eric Ding, Barry Lyu, Bhaskar Kataria, and Rachee Singh present Opus, a control plane for replacing electrical rail switches in ML datacenter rail-optimized fabrics with optical circuit switches and reconfiguring rails at parallelism phase boundaries. The paper evaluates Opus on a physical OCS testbed, the Perlmutter supercomputer up to 64 GPUs, and simulations up to 2,048 GPUs, reporting less than 6.7% iteration-time increase at OCS reconfiguration latencies of up to 100 ms, up to 4.27x lower networking infrastructure cost, and more than 23x lower network power consumption versus electrical rail-optimized fabrics."
