claim: "Applied Optoelectronics (NASDAQ: AAOI) reported Q3 2026 revenue of $269.9 million for the quarter ended September 30, 2026, up from $118.6 million in Q3 2025 and $191.9 million in Q2 2026, with datacenter revenue of $155.6 million versus $43.9 million a year earlier and CATV revenue of $110.9 million, and GAAP net income of $6.3 million ($0.07 basic) versus a $17.9 million loss in Q3 2025. Q4 2026 guidance is revenue of $385-420 million, non-GAAP gross margin of 29.5-31%, and non-GAAP net income of $45.9-60.4 million ($0.48-0.63 per share on ~96 million shares). CFO Stefan Murry stated total manufacturing equipment capacity approaching 330,000 units per month, installed capacity for over 500,000 pieces per month of 800G and 1.6T products by end-2026, and over 1 million pieces per month by end-2027, with the 2027 US capacity expansion delayed by electrical power procurement and construction issues. CEO Thompson Lin stated AOI recently secured a multi-year strategic agreement with a Tier 1 hyperscale datacenter customer."
