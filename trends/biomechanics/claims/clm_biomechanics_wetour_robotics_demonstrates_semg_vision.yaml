claim: "On September 1, 2026, Wetour Robotics Limited (NASDAQ: WETO) released a development demonstration of Orchestra combining Conductor, an 8-channel sEMG wristband, with VisionLink, a first-person camera, to capture synchronized hand movement, muscle activity, effort and action timing for robot-learning demonstrations. Wetour reported that in an internal carrying task its vision-only pipeline failed to locate the hand in 21.8% of frames, with a longest continuous dropout of 4.32 seconds, and that its current on-device model outputs 20 joint angles from a one-second sEMG window processed in 50.4 milliseconds with zero lookahead."
