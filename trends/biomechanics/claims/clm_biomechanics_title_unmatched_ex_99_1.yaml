claim: "Zimmer Biomet (NYSE/SIX: ZBH) reported Q3 2026 net sales of $2.0629 billion on November 4, 2026, up 3.1% reported and 3.7% constant currency, with net earnings of $191.6 million, diluted EPS of $1.00 (down 13.8%), adjusted diluted EPS of $1.90 flat year over year, and $560.0 million operating cash flow versus $372.4 million free cash flow. Segment results diverged: Knees fell to $767.5 million (-3.1% reported), while Hips rose 6.0% to $536.5 million, S.E.T. rose 6.8% to $578.3 million, and Technology & Data, Bone Cement and Surgical rose 11.9% to $180.6 million. The company raised full-year 2026 guidance to 4.4%-4.9% reported revenue change, 3.0%-3.5% organic constant currency growth, and adjusted diluted EPS of $8.50-$8.60, with the Paragon 28 acquisition (April 2025) contributing approximately 110bps excluded from organic figures. Zimmer Biomet also extended a multi-year limited exclusive distribution and supply agreement with THINK Surgical."
