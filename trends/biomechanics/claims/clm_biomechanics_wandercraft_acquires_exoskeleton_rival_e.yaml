claim: "Wandercraft acquired exoskeleton maker Ekso Bionics on undisclosed financial terms, purchasing it from a subsidiary of ChronoScale Holdings on October 1, 2026, with the boards of Wandercraft and ChronoScale Holdings Corporation unanimously approving the transaction, which was signed and closed simultaneously. The deal places four medical exoskeletons under one owner \u2014 Atalante X, EksoNR, Eve and Indego Personal \u2014 and pairs Ekso's U.S. commercial presence with Wandercraft's footprint in Europe, the Middle East and Africa; Atalante X and EksoNR are in use at more than 700 rehabilitation centers worldwide. Ekso's parent ChronoScale had earlier in 2026 outlined a plan to sell the exoskeleton maker and pivot to becoming a fully cloud-based AI infrastructure provider. Wandercraft is led by co-founder and CEO Matthieu Masselin; Ekso's CEO is Scott Davis."
