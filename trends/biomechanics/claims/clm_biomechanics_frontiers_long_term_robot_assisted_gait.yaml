claim: "On 24 September 2026, Frontiers in Human Neuroscience published Pawe\u0142 Chmara, Sabina Brazevi\u010d, Marek J\u00f3\u017awiak, and Faustyna Manikowska\u2019s study of 211 ambulatory hypertonic cerebral palsy patients undergoing 40 robot-assisted gait training sessions over two years using EksoGT, Lokomat Pro Pediatric, and G-EO systems. The study established that step length and stride length improved from T2 onward, walking speed from T3 onward, six-minute walk test distance at every follow-up, and at T5 the MCID responder rates were 61.61% for step length, 62.09% for stride length, 52.13% for walking speed, and 51.66% for 6MWT distance, while Gait Deviation Index MCID response reached 46.92%."
