claim: "Stryker (NYSE:SYK) reported Q3 2026 net sales of $6,520M, up 7.7% reported and organic, with MedSurg and Neurotechnology at $3,664M (+9.2%) and Orthopaedics at $2,856M (+5.7%, +5.9% constant currency); reported net earnings fell 12.3% to $753M and diluted EPS fell 11.7% to $1.96, while adjusted EPS rose 10.3% to $3.52 and adjusted operating margin rose 60 bps to 26.2%. Reported operating income declined 8.9% to $1,034M (15.9% of sales), driven by $293M of goodwill and other impairments and SG&A up 13.1% to $2,313M. Within Orthopaedics, Hips declined 1.0% to $453M and Knees grew 1.1% to $635M, while Ortho Tech grew 15.8% to $754M and Spinal Implants fell 43.9% to $4M. Stryker repurchased $1.0B of stock in the quarter, its Board approved a $3.0B repurchase increase in October 2026, and full-year 2026 guidance was set at 6.5%\u20137.0% organic sales growth and adjusted EPS of $14.80\u2013$14.90."
