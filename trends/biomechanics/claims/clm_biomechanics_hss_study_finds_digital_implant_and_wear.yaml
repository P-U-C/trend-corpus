id: clm_biomechanics_hss_study_finds_digital_implant_and_wear
type: claim
theme_id: biomechanics
claim: "Hospital for Special Surgery reported that its study of 1,080 total knee arthroplasty patients using an implanted digital device plus wearables, compared with 43,200 demographically similar controls from fall 2018 through fall 2023, found 90-day opioid prescription fills of 20% versus 23%, physical-therapy use of 37.3% versus 43%, and skilled-nursing-facility use of 0.65% versus 1.88%. At one year, digitally tracked patients had opioid prescription rates of 24.5% versus 27.85% and periprosthetic joint infection rates of 0.3% versus 1%."
