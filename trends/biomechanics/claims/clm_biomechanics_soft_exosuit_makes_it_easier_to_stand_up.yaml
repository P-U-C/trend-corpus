claim: "On September 28, 2026, the Technical University of Munich said researchers including Dr. Xiaohui Zhang and Prof. Lorenzo Masia developed a soft robotic exosuit that assists hip extension using artificial tendons, thigh sensors, a controller, and a back-worn motor unit. In a Nature Communications study published July 17, 2026, ten adults aged 69 to 85 with reduced lower-limb functional performance tested the exosuit; participants averaged 18 sit-to-stand cycles per minute, two more than before, while cycle duration fell by up to 21.9% and walking metabolic cost fell by an average 14%."
