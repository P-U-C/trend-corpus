claim: "In a mixed-methods observational pilot study published on September 1, 2026 in The Internet Journal of Allied Health Sciences and Practice, Sue D. Dahl-Popolizio, Adam M. Story, Thomas Hartman, Lacee Andrews, Jennifer Radziak, Angela Zhu, and Joelly Lobato de Faria reported that 12 participants with paraplegia from chronic spinal cord injury used a personal exoskeleton at home to perform ADL and IADL tasks. The study measured Canadian Occupational Performance Measure, Reintegration to Normal Living Index-modified, and Numeric Pain Rating Scale outcomes, reporting significant post-observation improvements in COPM performance (P = .008), COPM satisfaction (P = .003), RNLI-M scores (P = .04), lower NPRS pain versus wheelchair use (P = .01), and bowel/bladder function improvements in eight participants."
