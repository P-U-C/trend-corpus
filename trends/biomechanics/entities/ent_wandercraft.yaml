notes: Wandercraft is a private French exoskeleton developer and a catalyst entity for the theme. Its Atalante X rehab exoskeleton is in 100+ hospitals, and its 2025 Series D (backed by Renault Group and Bpifrance) funds the commercial launch of "Eve," billed as the first self-balancing personal exoskeleton. Funding, deployment, and FDA-indication milestones can reprice public exoskeleton comparables.
