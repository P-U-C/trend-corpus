summary: >
  Tracks public-market exposure to the engineering and quantification of human
  movement: robot-assisted orthopedic surgery and joint reconstruction, powered
  medical and industrial exoskeletons / exosuits, prosthetics and bionics,
  rehabilitation robotics, musculoskeletal (MSK) digital health, and the
  wearable motion-sensing and sports-science layer. The theme is growing because
  robotic-ortho installed bases (Mako, ROSA, ExcelsiusGPS), exoskeleton
  reimbursement and deployment milestones, MSK digital-health public listings,
  and a fresh prosthetics/bionics capital cycle are converging into visible
  commercial inflection rather than demos.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain operational or
  clinical guidance for medical devices, exoskeletons, or surgical robots,
  bypass instructions for device safety controls, patient-specific medical
  advice, private order intent, account details, or non-public technical or
  patient data.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
