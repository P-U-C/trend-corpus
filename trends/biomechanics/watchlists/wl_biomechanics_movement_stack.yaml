id: wl_biomechanics_movement_stack
title: Biomechanics movement-stack watchlist
monitor_for:
  - Stryker Mako and Zimmer Biomet ROSA installed-base, procedure-count, and next-gen clearance updates (Mako 4, Mako Spine, ROSA Knee OptimiZe US availability)
  - Globus Medical Enabling Technology / ExcelsiusGPS capital sales and cumulative robotic-procedure milestones
  - Myomo MyoPro reimbursement pipeline and revenue versus guidance; Ekso Bionics EksoNR/EVO unit growth and gross margin; Lifeward ReWalk 7 launch traction
  - Private exoskeleton catalysts — Wandercraft Eve commercial launch and funding, German Bionic Exia deployments, and any further FDA indications
  - Hinge Health post-IPO revenue, margin, and membership trajectory as the lead public MSK-software comparable; Sword Health valuation marks and IPO signals
  - Ottobock post-IPO disclosure and share performance; Materialise Medical segment growth versus group revenue; Garmin wearable-biomechanics feature cycle
  - Reimbursement, FDA clearance/recall, and standards-body developments affecting surgical robots, exoskeletons, and MSK digital health
