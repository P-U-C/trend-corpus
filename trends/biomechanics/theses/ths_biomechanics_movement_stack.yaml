id: ths_biomechanics_movement_stack
title: Biomechanics trades the human-movement stack
summary: >
  Biomechanics is best traded as a four-layer stack rather than a single name.
  The proven layer is robotic orthopedics, where surgical-robot installed bases
  (Mako, ROSA, ExcelsiusGPS) convert into durable implant pull-through. The
  inflection layer is exoskeletons, where medical and industrial hardware is
  crossing from pilots into reimbursed and deployed units. The margin layer is
  MSK digital health, where motion-tracking software (Hinge, Sword) scales payer
  reimbursement. The capital-cycle layer is prosthetics and bionics, where
  Ottobock's IPO and personalized-implant growth open listed exposure. Private
  developers (Wandercraft, German Bionic, Sword) set the catalyst clock; public
  pure plays (Myomo, Ekso, Lifeward, Hinge) carry the highest beta; diversified
  incumbents (Stryker, Zimmer Biomet, Globus, Materialise, Garmin) offer lower,
  more durable exposure. The useful watchlist mixes catalyst timing, commercial
  conversion, reimbursement, and the durability of each layer's economics.
