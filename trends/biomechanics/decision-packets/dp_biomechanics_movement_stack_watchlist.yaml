id: dp_biomechanics_movement_stack_watchlist
question: >
  Should the metalayer maintain a watchlist of biomechanics beneficiaries tied
  to robotic-ortho installed-base growth, exoskeleton reimbursement and
  deployment, MSK digital-health scaling, and the prosthetics/bionics capital
  cycle?
verdict: watchlist_candidate
execution_state: human_review_required
supporting_theses:
  - ths_biomechanics_movement_stack
supporting_claims:
  - clm_biomechanics_ortho_robotics_pullthrough
  - clm_biomechanics_exoskeleton_commercialization
  - clm_biomechanics_msk_digital_health
  - clm_biomechanics_prosthetics_bionics_capital
invalidation_conditions:
  - Robotic-ortho installed-base growth stalls and Stryker, Zimmer Biomet, or Globus stop citing robotics-driven implant pull-through as a revenue driver in quarterly disclosure.
  - Exoskeleton pure plays (Myomo, Ekso, Lifeward) miss revenue or cut guidance for two-plus consecutive quarters while reimbursement coverage fails to broaden, signalling the pilot-to-deployment crossing is not happening.
  - Hinge Health post-IPO growth decelerates sharply or turns unprofitable on a unit basis while Sword Health's valuation marks down, breaking the MSK digital-health margin thesis.
  - Ottobock trades materially below its IPO price with no bionics-driven growth narrative and Materialise's medical segment growth converges to flat, indicating the bionics capital cycle has stalled.
  - A device-safety, recall, or reimbursement-policy reversal affecting surgical robots or exoskeletons re-rates the whole category lower regardless of individual execution.
schema_version: 1
