notes: Lilly announced the Verve acquisition on 2025-06-17 and completed it on 2025-07-25. The transaction reprices the public CRISPR cohort by demonstrating that mega-cap pharma will pay control premia for in vivo base-editing platforms ahead of pivotal Phase 3 readouts. Cardiovascular gene editing now sits inside a vertically-integrated incumbent rather than a small clinical-stage developer.
