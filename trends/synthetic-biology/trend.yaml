summary: >
  Tracks public-market exposure to the engineered-biology sector: the CRISPR
  and base-editing clinical-stage cohort that now has commercial revenue
  (CRISPR Therapeutics on the Vertex-partnered Casgevy launch), the
  base-editing and in-vivo cohort still pre-commercial but with named
  near-term validation events (Beam, Intellia, Editas, Caribou, Prime
  Medicine), the cell-engineering and DNA-synthesis foundry layer (Ginkgo
  Bioworks, Twist Bioscience,
  Codexis), the long-read and short-read sequencing incumbents
  (Pacific Biosciences, Illumina), and the AI-bio drug-discovery adjacents
  whose 2026 data and filing events are cross-sector validation signals
  (Recursion Pharmaceuticals, Schrodinger). Private keystones include Scribe
  Therapeutics, Mammoth Biosciences, Synthego, and Inscripta. The theme is growing
  because commercial revenue from the first one-time gene therapies has
  begun to compound while the broader base-editing and in-vivo cohort
  is moving through 2026-2027 indication expansion, Prime Editing has a
  public pure-play comp, and Lilly's July 2025 Verve Therapeutics acquisition
  closed the most aggressive cardiovascular gene-editing bet.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain private
  patient identifiers, non-public clinical trial data, gain-of-function
  pathogen research details, non-public BLA / IND submission contents,
  proprietary cell-line recipes, non-public order intent, account details,
  laboratory biosecurity protocols, or non-public M&A or licensing terms.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
