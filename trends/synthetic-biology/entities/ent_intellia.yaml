notes: First demonstrated in vivo CRISPR systemic dosing in humans with NTLA-2001, now nex-z, for transthyretin amyloidosis. Patient screening resumed in MAGNITUDE and MAGNITUDE-2 Phase 3 studies in 2026 after FDA hold resolution. NTLA-2002, now lonvo-z, produced positive Phase 3 HAELO data in hereditary angioedema, with BLA submission planned for H2 2026. Primary HIGH-tier scanner seed for in vivo platform.
