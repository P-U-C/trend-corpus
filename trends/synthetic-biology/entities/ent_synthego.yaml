notes: Largest dedicated CRISPR reagent supplier. Custom synthetic guide RNAs (sgRNA), Cas9 protein, and engineered cell lines. GMP-grade gRNA supply is a structural bottleneck for clinical-stage CRISPR developers; Synthego is a private keystone whose capacity expansion or pricing change shifts every downstream program.
