claim: "On October 8, 2026, CRISPR Therapeutics announced that Phase 1b clinical data for CTX310, its investigational CRISPR/Cas9 in vivo gene-editing therapy targeting ANGPTL3 for severe hypertriglyceridemia, will be presented as a late-breaking oral presentation at the American Heart Association Scientific Sessions 2026 on November 9, 2026 at 8:00 a.m. CST. CRISPR Therapeutics also stated that its in vivo liver-editing portfolio includes CTX310 for familial hypercholesterolemia, mixed dyslipidemias, and severe hypertriglyceridemia; CTX340 targeting AGT for refractory hypertension; CTX321 targeting LPA for elevated lipoprotein(a); and CTX460 targeting SERPINA1 using SyNTase editing for alpha-1 antitrypsin deficiency."
