claim: "In the New England Journal of Medicine article \u201cIn Vivo Base Editing of PCSK9 with VERVE-102 for Hypercholesterolemia,\u201d published August 13, 2026, Scott B. Vafai, Sekar Kathiresan, and coauthors reported a Verve Therapeutics-funded Phase 1 open-label single-ascending-dose study of VERVE-102, an investigational adenine base-editing therapy targeting PCSK9. In 35 adults with heterozygous familial hypercholesterolemia or premature coronary artery disease, one intravenous VERVE-102 infusion across six dose cohorts produced mean PCSK9 reductions from 51% at 0.3 mg/kg to 88% at 1.0 mg/kg and LDL-cholesterol reductions from 9% to 62%, with no dose-limiting toxic effects and ClinicalTrials.gov identifier NCT06164730."
