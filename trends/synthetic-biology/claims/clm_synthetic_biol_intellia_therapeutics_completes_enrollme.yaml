theme_id: synthetic-biology
claim: "On November 4, 2026, Intellia Therapeutics announced completion of enrollment in MAGNITUDE-2 (NCT06672237), its randomized, double-blind, placebo-controlled Phase 3 trial of nexiguran ziclumeran (nex-z) in approximately 60 adults with hereditary transthyretin amyloidosis with polyneuropathy. Participants were randomized 1:1 to a single 55 mg nex-z infusion or placebo; primary endpoints are change in modified neuropathy impairment score at month 18 and change in serum transthyretin levels at day 29. Nex-z is an investigational in vivo CRISPR/Cas9 therapy designed to inactivate the liver TTR gene, and Intellia leads its development and commercialization with Regeneron Pharmaceuticals."
