claim: "On August 13, 2026, Caribou Biosciences reported EHA 2026 phase 1 data for its allogeneic CAR-T candidates vispacabtagene regedleucel and CB-011. In ANTLER, 27 second-line LBCL patients receiving 80 million optimized vispa-cel cells had 82% ORR, 67% CR, and 17.1-month median PFS; in CaMMouflage, 12 BCMA-naive r/r multiple myeloma patients receiving 450 million CB-011 cells had 92% ORR, 83% CR or stringent CR, and 91% MRD negativity among 10 of 11 evaluable patients."
