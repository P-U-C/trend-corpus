id: clm_synbio_casgevy_commercial_compounding
claim: CRISPR Therapeutics reported Q1 2026 Casgevy revenue of $43M and disclosed that more than 500 patients have initiated treatment, with full-year 2025 revenue of $116M and a $2B cash position, making CRSP the first publicly-listed CRISPR developer with compounding commercial revenue from a one-time gene therapy. The discrete quarterly catalyst is the patient-initiation count rather than reported revenue, because gross-margin and revenue-share booking lag the cell-collection event by quarters.
