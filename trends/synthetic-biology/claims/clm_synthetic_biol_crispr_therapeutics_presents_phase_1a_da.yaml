claim: "On August 28, 2026, CRISPR Therapeutics AG presented Phase 1a data for CTX310, an investigational in vivo CRISPR/Cas9 therapy targeting ANGPTL3, at ESC Congress 2026 and reported simultaneous publication in The New England Journal of Medicine. In 15 participants with at least one year of follow-up, the highest 0.8 mg/kg dose produced mean reductions from baseline of 79% in circulating ANGPTL3, 48% in triglycerides, and 53% in LDL, with no treatment-related serious adverse events or dose-limiting toxicities reported."
