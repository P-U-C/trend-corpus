id: clm_synbio_dna_writing_supply_chokepoint
claim: Synthetic DNA write capacity, GMP gRNA supply, and workflow integrations concentrate value upstream of clinical-stage developers, but the margin-capture thesis is uneven across suppliers. Twist Bioscience's three-year $15M prepaid Ginkgo Bioworks agreement and Benchling's 2026 one-click ordering integration support a durable discovery-to-supply channel, while Ginkgo's Q1 2026 revenue decline to $19.5M and negative $42M adjusted EBITDA show that broad foundry economics remain a turnaround case rather than a steady compounding layer.
