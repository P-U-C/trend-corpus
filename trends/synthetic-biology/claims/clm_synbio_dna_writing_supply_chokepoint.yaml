id: clm_synbio_dna_writing_supply_chokepoint
claim: Synthetic DNA write capacity and GMP gRNA supply concentrate value upstream of the clinical-stage developers. Twist Bioscience's three-year $15M prepaid Ginkgo Bioworks agreement, Ginkgo's Bioworks4 mammalian foundry, and Synthego's GMP gRNA dominance show that the foundry / supply layer compounds revenue more steadily than any single clinical readout, even though it lacks the option-value upside of a successful BLA approval. The Benchling one-click ordering integration further commoditizes the discovery-to-supply workflow, structurally pulling margin into the foundry layer.
