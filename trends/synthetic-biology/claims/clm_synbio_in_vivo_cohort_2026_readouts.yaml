id: clm_synbio_in_vivo_cohort_2026_readouts
claim: The in vivo, base-editing, prime-editing, and AI-bio cohort has a dense 2026-2027 validation calendar that will reprice
  the broader engineered-biology platform sector. Named near-term events include Beam Therapeutics BEAM-302 pivotal-cohort
  initiation in alpha-1 antitrypsin deficiency, Intellia lonvo-z BLA work in hereditary angioedema and resumed nex-z MAGNITUDE
  / MAGNITUDE-2 Phase 3 screening, Prime Medicine PM359 regulatory alignment plus PM577 and PM647 IND / CTA filings, Editas
  EDIT-401 first-in-human proof-of-concept work, Caribou vispa-cel pivotal-funding and CB-011 RMAT follow-up, Recursion REC-1245
  / REC-4881 / REC-4539 updates, Takeda / Schrodinger zasocitinib Phase 3 and NDA filing, and the Eli Lilly post-close update
  on Verve VERVE-102 LDL cholesterol base editing. The cluster of independent events makes 2026 the first year where the platform
  thesis can be tested across multiple chemistries simultaneously.
