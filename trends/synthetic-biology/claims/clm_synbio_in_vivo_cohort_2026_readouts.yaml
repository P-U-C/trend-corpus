id: clm_synbio_in_vivo_cohort_2026_readouts
claim: The in vivo and base-editing cohort has a dense 2026 readout calendar that will reprice the entire CRISPR-platform sector. Named near-term events include Beam Therapeutics BEAM-302 alpha-1 antitrypsin clinical updates, Intellia NTLA-2001 MAGNITUDE Phase 3 in transthyretin amyloidosis cardiomyopathy, Recursion REC-394 Phase 2 in C. difficile (Q1 2026) and REC-1245 Phase 1 (H1 2026), Schrodinger zasocitinib Phase III readouts, and the Eli Lilly post-acquisition update on Verve VERVE-102 LDL cholesterol base editing. The cluster of independent readouts makes 2026 the first year where the platform thesis can be falsified across multiple chemistries simultaneously.
