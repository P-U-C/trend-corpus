claim: "On November 10, 2026, Beam Therapeutics (Nasdaq: BEAM) reported topline results from the BEACON Phase 1/2 trial of ristoglogene autogetemcel (risto-cel, formerly BEAM-101), a one-time autologous base-edited CD34+ HSPC therapy targeting the HBG1/2 promoters in sickle cell disease, stating the trial met its primary efficacy endpoint of freedom from severe vaso-occlusive crises for at least 12 consecutive months (VF12) on independently adjudicated results, all primary safety endpoints at a prespecified interim analysis, and all secondary endpoints including freedom from inpatient hospitalization for severe VOCs for 12 consecutive months. As of the October 20, 2026 data cutoff, 39 adults and 10 adolescents had been treated and 31 patients had completed the VF12 follow-up period. Beam said it expects to submit a U.S. BLA to the FDA as early as year-end 2026, with detailed pivotal results planned for a 2027 medical meeting and an earlier-cutoff oral presentation at the 68th ASH Annual Meeting, December 12\u201315, 2026, in New Orleans."
