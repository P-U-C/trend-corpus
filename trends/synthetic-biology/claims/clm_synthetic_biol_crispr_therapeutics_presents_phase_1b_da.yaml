claim: "On November 9, 2026, CRISPR Therapeutics reported Phase 1b data for CTX310, an investigational in vivo CRISPR/Cas9 therapy targeting ANGPTL3, in 10 participants with severe hypertriglyceridemia. A single intravenous course produced mean Day-30 reductions of 65% in circulating ANGPTL3 and 63% in triglycerides; seven participants had at least 90 days of follow-up, with reductions maintained in those participants and no treatment-related serious adverse events reported."
