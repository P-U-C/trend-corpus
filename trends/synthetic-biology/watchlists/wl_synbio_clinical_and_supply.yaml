id: wl_synbio_clinical_and_supply
title: Synthetic-biology clinical and supply watchlist
monitor_for:
  - CRISPR Therapeutics quarterly Casgevy revenue, patient initiations, first cell collections, and Vertex partner-profit-share disclosures
  - Beam Therapeutics BEAM-302 alpha-1 antitrypsin pivotal-cohort timing and risto-cel sickle-cell BLA-track progress
  - Intellia Therapeutics lonvo-z hereditary angioedema BLA timing plus nex-z MAGNITUDE and MAGNITUDE-2 Phase 3 screening / dosing resumption
  - Prime Medicine PM359 regulatory-alignment and BLA path, PM577 Wilson disease IND / CTA timing, and PM647 AATD IND / CTA timing
  - Editas Medicine EDIT-401 first-in-human trial initiation and in vivo platform proof-of-concept disclosures
  - Caribou Biosciences vispa-cel pivotal funding, CB-011 RMAT follow-up, and ChRDNA off-the-shelf cell-therapy data
  - Ginkgo Bioworks revenue cadence, autonomous-lab utilization, divested biosecurity economics, cash-burn guidance, and adjusted-EBITDA breakeven trajectory
  - Twist Bioscience SynBio revenue, prepaid customer agreement cadence (Ginkgo type), and antibody-discovery contract flow
  - Pacific Biosciences Revio and Vega placements plus clinical-research customer adoption
  - Recursion Pharmaceuticals REC-1245, REC-4881, REC-4539, and pipeline updates; Schrodinger / Takeda zasocitinib NDA filing plus software-license customer renewals
  - Eli Lilly post-Verve VERVE-102 update cadence as the downstream cardiovascular gene-editing signal
  - FDA CBER guidance updates touching RMAT, BLA filings, breakthrough designations, and gene-therapy post-market surveillance
  - Private-keystone fundraise marks and OEM-equivalent license-deal disclosures from Scribe, Mammoth, Synthego, Inscripta
schema_version: 1
