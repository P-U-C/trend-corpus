id: wl_synbio_clinical_and_supply
title: Synthetic-biology clinical and supply watchlist
monitor_for:
  - CRISPR Therapeutics quarterly Casgevy revenue, patient initiations, first cell collections, and Vertex partner-profit-share disclosures
  - Beam Therapeutics BEAM-302 alpha-1 antitrypsin clinical updates and BEAM-101 sickle cell pivotal-track progress
  - Intellia Therapeutics NTLA-2001 (nex-z) MAGNITUDE Phase 3 transthyretin amyloidosis cardiomyopathy readouts and NTLA-2002 hereditary angioedema progress
  - Editas Medicine reni-cel partnering announcements and in vivo platform pivot disclosures
  - Caribou Biosciences CB-010 and CB-011 cohort readouts and ChRDNA off-the-shelf cell-therapy IND additions
  - Ginkgo Bioworks revenue cadence, Bioworks4 utilization, ARPA-H contract flow, and 2026 adjusted-EBITDA breakeven trajectory
  - Twist Bioscience SynBio revenue, prepaid customer agreement cadence (Ginkgo type), and antibody-discovery contract flow
  - Pacific Biosciences Revio and Vega placements plus clinical-research customer adoption
  - Recursion Pharmaceuticals REC-394, REC-1245, and pipeline updates; Schrodinger zasocitinib Phase III readouts plus software-license customer renewals
  - Eli Lilly post-Verve VERVE-102 update cadence as the downstream cardiovascular gene-editing signal
  - FDA CBER guidance updates touching RMAT, BLA filings, breakthrough designations, and gene-therapy post-market surveillance
  - Private-keystone fundraise marks and OEM-equivalent license-deal disclosures from Scribe, Mammoth, Synthego, Inscripta
schema_version: 1
