id: clm_edgeai_platform_consolidation
claim: Edge-AI is consolidating from chip vendor to full-stack platform. Qualcomm closed five acquisitions in 18 months (Augentix, Arduino, Edge Impulse, Focus.AI, Foundries.io), repositioning from chipset to full-stack edge-AI platform. Lattice Semiconductor signed a $1.65B definitive agreement to acquire AMI on May 4, 2026 with Q3 2026 expected close. Tenstorrent's $700M Series D at $2.6B valuation (Samsung Securities, LG Electronics, Fidelity, Bezos Expeditions) and Axelera AI's more-than-$250M 2026 funding round give the private cohort capital depth to ship reference-design platforms alongside silicon. The consolidation shifts margin from raw silicon SKU to bundled developer tooling, model-zoo IP, and certified reference-design libraries.
