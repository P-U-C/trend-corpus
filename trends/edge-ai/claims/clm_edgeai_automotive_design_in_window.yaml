id: clm_edgeai_automotive_design_in_window
claim: The automotive L2-plus and L3 design-in window is open and converting to mass production at multiple edge-AI silicon developers simultaneously. Ambarella CV3-AD685 moved into mass production during 2025 with Continental and Bosch radar-vision fusion integration; Hailo-10H is AEC-Q100 Grade 2 qualified and scheduled for 2026 in-vehicle production at cockpit displays, driver monitoring, and IVI; NXP i.MX 95 plus S32 family ship embedded NPU features in current automotive socket; SiMa.ai MLSoC competes in the same ADAS reference-design slots. The quantified Ambarella auto opportunity pipeline (~$13B fiscal 2027-2032, ~$2.2B funnel) plus the Hailo-10H production schedule make 2026 the year design-in conversion can be tracked at quarterly cadence.
