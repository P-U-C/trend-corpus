id: clm_edgeai_automotive_design_in_window
claim: The automotive L2-plus and L3 design-in window is open and converting, but the clean public metric is design-in and SOP cadence rather than a blanket assertion that all high-end edge-AI SoCs are already in mass production. Ambarella reports approximately $13B of fiscal 2027-2032 auto opportunities across won and invited-to-bid programs, with the CV3-AD685 / Continental autonomy ramp still tracked against customer SOP timing; Hailo-10H is AEC-Q100 Grade 2 qualified and aimed at 2026 automotive designs; Mobileye EyeQ6H-based SuperVision and Chauffeur milestones plus indie Semiconductor vision-processor shipments add public automotive edge-AI comparables. NXP i.MX 95 plus S32 family and SiMa.ai MLSoC remain adjacent embedded / private signals.
