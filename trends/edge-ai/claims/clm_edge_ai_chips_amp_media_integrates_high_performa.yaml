claim: "On 2026-11-13 Chips&Media (KOSDAQ: 094360) announced that Mobilint has begun mass production of next-generation edge AI chips incorporating Chips&Media video codec IP, targeting physical AI, robotics and humanoid markets. Mobilint previously licensed H.264/AVC, H.265/HEVC and AV1 codecs and recently added AV2 and H.266/VVC licenses. Chips&Media's VPU was selected for 8K 60fps single-core multi-stream encoding, with robot chips processing 8 to 20 camera channels, and for its ISO 26262 ASIL-B functional safety certification. The companies stated plans to extend the partnership to Frame Buffer Compression and Data Compression IP; Mobilint's 'Regulus' AI semiconductor was deployed on the Naro space launch vehicle."
