id: clm_edgeai_supply_constraint_bis
claim: Two upstream constraints need to be monitored, but only one is directly supported as a current factual constraint in this corpus. BIS advanced-computing export-control rules materially affect China-bound shipment paths for datacenter-class AI chips and can spill into edge-AI suppliers with China exposure; the leading regulatory signal is changes to ECCN 3A090 / 4A090 treatment, Entity List scope, and license-review standards. TSMC 5nm / 4nm, N3, and CoWoS-class capacity remain important supply-watchlist inputs because AI/HPC demand dominates leading-edge capacity, but current TSMC commentary says it is maximizing support across platforms rather than proving that edge SoCs are being crowded out.
