id: clm_edgeai_supply_constraint_bis
claim: Two parallel structural constraints sit upstream of every edge-AI design win. First, TSMC 5nm / 4nm wafer allocation and CoWoS-class advanced packaging is concentrated against datacenter training silicon, crowding out edge SoCs from premium nodes and forcing edge designers (Ambarella, Synaptics, Hailo) onto longer-tail nodes. Second, BIS export-control updates on advanced computing and AI chips materially affect China-bound shipments for QCOM, AMBA, NVDA Jetson, and supply-chain partners; entity-list additions and license-exception changes are the leading regulatory signal.
