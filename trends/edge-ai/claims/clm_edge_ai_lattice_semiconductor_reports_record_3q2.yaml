claim: "Lattice Semiconductor (Nasdaq: LSCC) reported fiscal 3Q26 revenue of $291.0 million for the quarter ended October 3, 2026, up 118.3% year-over-year from $133.3 million, with GAAP gross margin of 67.4%, GAAP diluted EPS of $0.08, non-GAAP diluted EPS of $0.72, and adjusted EBITDA of $131.0 million (45.0% margin). FPGA revenue grew approximately 90% year-over-year, and revenue from new products grew more than 70% year-over-year, tracking to 25% of FPGA revenue in 2026. Results include AMI, acquired July 27, 2026, with prior periods excluding it; 4Q26 guidance is $325\u2013345 million revenue, 72.0% \u00b11% non-GAAP gross margin, and non-GAAP EPS of $0.82\u2013$0.86. In the quarter Lattice announced the Secure Control and Management Plane with AMD, Arm, ASPEED, Intel, Jabil, Microsoft and NXP at OCP Global Summit, the Mach-N2 FPGA family with post-quantum cryptography, Lattice Sentry 5.0, and AMI Rack Manager 1.0."
