summary: >
  Tracks public-market exposure to on-device AI inference silicon and
  edge-AI platform software: pure-play edge-vision and embedded NPU
  designers (Ambarella, Synaptics, Lattice Semiconductor), automotive
  edge-AI comparables (Mobileye EyeQ6, indie Semiconductor vision
  processors), and embedded MCU / analog incumbents with material
  edge-AI exposure (NXP Semiconductors, STMicroelectronics, Texas
  Instruments), mega-cap
  semiconductor primes whose edge programs reset the addressable market
  (Qualcomm with Dragonwing and the Augentix / Arduino / Edge Impulse /
  Focus.AI / Foundries.io
  acquisitions, ARM as NPU IP licensor), and the privately-held edge-AI
  silicon cohort whose fundraise marks and design-in disclosures reprice
  the public set (Hailo, Mythic, Tenstorrent, SiMa.ai, Untether AI,
  Axelera AI). The theme is growing because the 2026 design-in window
  for automotive L2-plus, smart-camera, robotics, and on-device
  generative-AI workloads is open and converting into SOP, customer,
  and revenue milestones across multiple developers.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain non-public
  customer design-win details, proprietary firmware or RTL, non-public
  TSMC wafer-allocation terms, non-public OEM bill-of-materials, BIS
  export-control non-public information, non-public order intent, account
  details, or non-public M&A or licensing terms.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
