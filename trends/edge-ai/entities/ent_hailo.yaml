notes: >
  Israeli edge-AI silicon pure play. Hailo-10H GenAI accelerator became
  commercially available in July 2025, is AEC-Q100 Grade 2 qualified, uses
  2.5W typical power, and is aimed at automotive designs with 2026 start of
  production. Hailo's $120M Series C extension was announced in April 2024,
  not mid-2025; July 2025 reporting separately put total raised at about
  $564M across nine rounds. Direct competitor for AMBA and SYNA design-in
  slots.
