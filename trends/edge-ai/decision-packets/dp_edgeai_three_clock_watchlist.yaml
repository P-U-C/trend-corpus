id: dp_edgeai_three_clock_watchlist
question: Should the metalayer maintain a watchlist of pure-play edge-AI silicon (AMBA, SYNA, LSCC, MBLY, INDI) plus large-cap edge-AI primes (QCOM, ARM) plus embedded MCU adjacents (NXP, STM, TI) plus private keystones (Hailo, Mythic, Tenstorrent, SiMa.ai, Untether AI, Axelera AI), tracked against the automotive design-in conversion cadence, the platform consolidation calendar, and the BIS / TSMC supply-constraint signal?
verdict: watchlist_candidate
execution_state: human_review_required
supporting_theses:
  - ths_edgeai_three_layer_pile_up
supporting_claims:
  - clm_edgeai_automotive_design_in_window
  - clm_edgeai_platform_consolidation
  - clm_edgeai_supply_constraint_bis
invalidation_conditions:
  - Ambarella reduces the published fiscal 2027-2032 auto opportunity figure from approximately $13B to below $9.1B at the next annual funnel update, or stops disclosing won / invited-to-bid auto opportunity data, collapsing the automotive design-in catalyst.
  - Qualcomm publicly slows or unwinds the Augentix / Arduino / Edge Impulse / Focus.AI / Foundries.io integration or fails to ship Dragonwing IQ10 reference designs in volume by end-2026, breaking the full-stack platform-consolidation case.
  - BIS materially loosens advanced-computing controls by amending ECCN 3A090 / 4A090, Supplement No. 2 to Part 748 paragraph (dd), or the related 15 CFR 742 / 744 license-review standards to create broad China-bound eligibility beyond the January 15, 2026 case-by-case path, eliminating the regulatory-premium signal.
  - TSMC reports in earnings materials that N3 / N5 / CoWoS-class capacity is no longer tight for AI/HPC customers, or that automotive / IoT leading-edge demand becomes the primary driver of new capacity additions, eliminating the supply-watchlist risk.
  - A second mega-cap acquirer (AVGO, NVDA, AAPL, GOOGL) takes a public edge-AI pure play out at a control premium below current trading levels, signaling that strategic value tops out below standalone-platform expectations.
schema_version: 1
