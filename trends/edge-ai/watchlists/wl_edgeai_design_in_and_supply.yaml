id: wl_edgeai_design_in_and_supply
title: Edge-AI design-in conversion and supply watchlist
monitor_for:
  - Ambarella quarterly auto opportunity pipeline (won and invited-to-bid), CV3-AD design-in disclosures, and the awarded-to-revenue conversion cadence
  - Synaptics Astra SL2610 commercial-availability ramp, COMPUTEX 2026 and CES customer announcements, and Qualcomm partnership updates
  - Lattice Semiconductor AMI acquisition close timeline, NVIDIA edge-collab platform customer wins, and TI sensor-bridge revenue ramp
  - Qualcomm Dragonwing IQ10 design-in disclosures plus integration progress for Arduino, Edge Impulse, Foundries.io
  - NXP i.MX 95 plus S32 family auto socket wins and STM32N6 Neural-ART customer adoption
  - Hailo, Mythic, SiMa.ai, Tenstorrent, Untether AI fundraise marks, IPO calendar, and design-in / reference-design disclosures
  - Arm Ethos NPU royalty revenue trajectory and premium-tier Cortex-A mix shift as proxy for edge-AI volume
  - BIS Federal Register notices on advanced-computing export controls, Entity-List additions touching AI silicon, and license-exception modifications
  - TSMC capex guidance for the edge node mix (5nm / 4nm / 7nm) plus CoWoS-class packaging capacity allocation
  - NHTSA AV rule updates and EU AI Act enforcement guidance touching in-vehicle and industrial edge inference
schema_version: 1
