id: ths_edgeai_three_layer_pile_up
title: Edge-AI splits across automotive design-in conversion, full-stack platform consolidation, and upstream wafer / BIS supply constraint
summary: >
  Edge-AI is a three-clock sector. The fast clock is automotive design-in
  conversion: Ambarella's $13B fiscal 2027-2032 auto opportunity and
  CV3-AD685 customer SOP timing, Hailo-10H AEC-Q100 production-ready for
  2026 automotive designs, Mobileye EyeQ6H / SuperVision and indie
  vision-processor shipments, NXP i.MX 95 plus S32 family shipping, and
  SiMa.ai competing in the same reference-design slots. The medium clock
  is full-stack platform
  consolidation: Qualcomm absorbing Arduino plus Edge Impulse plus
  Foundries.io plus Augentix and Focus.AI, Lattice signing $1.65B AMI,
  Synaptics layering Astra
  multimodal GenAI on top of its biometric IP, Tenstorrent capitalizing
  for reference-design distribution, and Axelera scaling an edge-first
  European accelerator stack. The slow clock is upstream supply and
  regulatory: BIS export-control updates affecting China-bound shipment
  paths and TSMC leading-edge / advanced-packaging capacity as a
  watchlist risk rather than a proved edge-SoC crowd-out fact. Private
  keystones (Hailo, Mythic, Tenstorrent, SiMa.ai, Untether AI, Axelera
  AI) reprice the public cohort through fundraise marks and design-in
  disclosures; ARM as IP licensor inherits revenue from all of the above
  through Ethos NPU royalty growth. The useful watchlist combines (a)
  Ambarella auto pipeline and SOP conversion, (b) Mobileye / indie public
  automotive edge-AI shipment signals, (c) Hailo / SiMa.ai / Axelera
  design-in disclosures, (d) Qualcomm-Arduino integration revenue
  cadence, (e) BIS / Entity-List additions and license-review standards
  touching AI silicon, and (f) TSMC capex guidance for the edge node mix.
