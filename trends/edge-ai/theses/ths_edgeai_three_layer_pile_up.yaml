id: ths_edgeai_three_layer_pile_up
title: Edge-AI splits across automotive design-in conversion, full-stack platform consolidation, and upstream wafer / BIS supply constraint
summary: >
  Edge-AI is a three-clock sector. The fast clock is automotive design-in
  conversion: Ambarella CV3-AD685 in mass production with Continental and
  Bosch, Hailo-10H AEC-Q100 production-ready for 2026 in-vehicle launch,
  NXP i.MX 95 plus S32 family shipping, SiMa.ai competing in the same
  reference-design slots. The medium clock is full-stack platform
  consolidation: Qualcomm absorbing Arduino plus Edge Impulse plus
  Foundries.io, Lattice signing $1.65B AMI, Synaptics layering Astra
  multimodal GenAI on top of its biometric IP, Tenstorrent capitalizing
  for reference-design distribution. The slow clock is upstream supply
  and regulatory: TSMC 5nm / 4nm wafer allocation and CoWoS-class
  packaging concentrated against datacenter training silicon, BIS
  export-control updates affecting China-bound shipments. Private
  keystones (Hailo, Mythic, Tenstorrent, SiMa.ai, Untether AI) reprice
  the public cohort through fundraise marks and design-in disclosures;
  ARM as IP licensor inherits revenue from all of the above through Ethos
  NPU royalty growth. The useful watchlist combines (a) Ambarella auto
  pipeline awarded-to-revenue conversion, (b) Hailo / SiMa.ai design-in
  disclosures, (c) Qualcomm-Arduino integration revenue cadence, (d)
  BIS / Entity-List additions touching AI silicon, and (e) TSMC capex
  guidance for the edge node mix.
