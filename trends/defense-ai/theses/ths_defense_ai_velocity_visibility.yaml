id: ths_defense_ai_velocity_visibility
title: Defense-AI splits between contract velocity (privates) and budget visibility (publics)
summary: >
  Defense-AI is a two-clock sector. The fast clock is private contract velocity --
  Anduril, Shield AI, Saronic, Skydio absorbing Replicator and Mid-Tier Acquisition
  flow at multi-quarter cadence. The slow clock is the NDAA / RDT&E line-item
  visibility that public adjacents trade on. Public pure plays (PLTR, AVAV, KTOS)
  inherit the priced-in revaluation a few quarters after each private fundraise
  mark or program-of-record transition. Services integrators (LDOS, BAH, CACI,
  SAIC) get a steadier but lower-beta slice. Primes (LMT, NOC, RTX, GD) carry
  AI / autonomy as a slice of huge top lines and are not pure plays. The useful
  watchlist is a mix of private-mark catalysts, NDAA / RDT&E line-item deltas,
  and DoD contract-award flow.
