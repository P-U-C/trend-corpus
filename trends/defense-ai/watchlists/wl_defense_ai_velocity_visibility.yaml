id: wl_defense_ai_velocity_visibility
title: Defense-AI velocity and visibility watchlist
monitor_for:
  - DoD daily contract-award feed at defense.gov / contracts -- filter for autonomous, AI, software-spine line items
  - Anduril fundraise cadence, valuation marks, and Replicator / Roadrunner / Bolt-M / Fury contract disclosures
  - Shield AI, Saronic, Saildrone, Skydio fundraises and named program wins
  - NDAA passage and RDT&E line-item year-over-year deltas, including Replicator tranche sizing
  - DARPA program-of-record transitions and Joint All-Domain Command and Control (JADC2 / CJADC2) milestones
  - BIS export-control list updates touching AI for defense, advanced computing, and autonomous systems
  - Quarterly results and program metrics from PLTR, LDOS, AVAV, KTOS, BAH, CACI for AI / autonomy revenue mix
schema_version: 1
