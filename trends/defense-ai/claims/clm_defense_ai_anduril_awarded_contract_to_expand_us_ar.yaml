claim: "On Sept. 30, 2026 the US Army awarded Anduril Industries $162.8 million to continue work on the Next Generation Command and Control (NGC2) common data baseline, under a five-year contract with options raising total value up to $1.8 billion, moving NGC2 from experimentation to fielding. Anduril built the NGC2 prototype for the 4th Infantry Division using its Lattice AI operating system, and the baseline work also involves Palantir, Raft and Striveworks. The award extends NGC2 to I Corps, the Army's Indo-Pacific command, following a May 2026 deployment at Fort Carson and Pinon Canyon using over 160 tactical edge computers, over 2,500 devices and 40 applications, and the July 2026 Project Convergence-Capstone 6 event at Fort Irwin with 10,000 participants and 90 technologies. NGC2 is intended to replace the Army's first-generation command-and-control system covering fire, logistics and airspace control."
