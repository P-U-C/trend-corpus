claim: "Kratos Defense & Security Solutions (NASDAQ: KTOS) reported Q3 2026 (quarter ended September 27, 2026) revenues of $471.8M, up 35.7% from $347.6M in Q3 2025 with 23.2% organic growth, an operating loss of $4.9M, net loss of $0.2M, adjusted EBITDA of $50.9M (10.8% margin), and adjusted EPS of $0.24 versus $0.14 a year earlier. Government Solutions (KGS) revenues were $397.2M, up 52.5% and 35.8% organic, led by Defense Rocket Systems organic growth of 149.0%; Unmanned Systems (KUS) revenues fell to $74.6M from $87.2M, which had included $16.1M of Valkyrie shipments to an international customer. Q3 bookings were $1.037B for a 2.2-to-1 book-to-bill, backlog was $2.650B (funded $2.067B, unfunded $582.9M) versus $2.084B at June 28, 2026, and the bid and proposal pipeline was $15.5B. Kratos tightened FY2026 revenue guidance to $1.780\u20131.810B with adjusted EBITDA of $176\u2013180M and free cash flow use of $110\u2013120M, and issued an initial FY2027 forecast of $2.1\u20132.2B revenue and $230\u2013240M adjusted EBITDA assuming the continuing resolution extends into Q1 2027, including sales of roughly 1,500 turbojet engines in 2027 against production capacity ramping to 3,000 engines."
