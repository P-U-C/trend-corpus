id: dp_defense_ai_velocity_visibility_watchlist
question: Should the metalayer maintain a watchlist of defense-AI primes plus autonomous-systems pure-plays correlated to NDAA, Replicator, and DARPA award flow?
verdict: watchlist_candidate
execution_state: human_review_required
supporting_theses:
  - ths_defense_ai_velocity_visibility
supporting_claims:
  - clm_defense_ai_anduril_velocity
  - clm_defense_ai_ndaa_visibility
  - clm_defense_ai_export_controls
invalidation_conditions:
  - Replicator program funding cancelled or reduced by more than 50 percent in the next NDAA appropriations cycle, with no clear successor autonomous-systems acquisition vehicle.
  - AUKUS Pillar II export agreement collapses or is suspended for two consecutive quarters, removing a structural tailwind for AI / autonomy vendor international addressable market.
  - Anduril postpones an IPO or primary financing event past 2026 with no replacement private valuation mark, breaking the private-mark catalyst clock the public adjacents revalue against.
  - DoD acquisition reform reverses Mid-Tier Acquisition Authority and Other Transaction Authority pathways, returning award flow to the legacy primes and starving nontraditional autonomous-systems vendors.
