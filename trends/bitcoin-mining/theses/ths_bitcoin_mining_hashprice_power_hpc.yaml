id: ths_bitcoin_mining_hashprice_power_hpc
title: Bitcoin-mining revalues on hashprice, power access, ASIC efficiency, and AI / HPC lease conversion
summary: >
  Bitcoin mining is a four-clock sector. The fastest clock is pricing:
  hashprice, BTC spot price, transaction fees, and network difficulty determine
  daily miner revenue per PH/s. The second clock is power access: ERCOT
  registration, Texas SB 6 interconnection rules, New York proof-of-work
  review, power credits, and curtailment programs determine realized hashrate
  and cash cost. The third clock is ASIC supply: Bitmain / MicroBT /
  Canaan delivery timing, tariff exposure, and fleet efficiency determine
  who survives the post-halving margin compression. The fourth clock is
  capital-market rerating: CORZ, HUT, IREN, BTBT, HIVE, WULF, BITF, and CIFR
  increasingly trade as power-first AI / HPC conversion platforms, while MARA,
  RIOT, and CLSK carry cleaner BTC-cycle beta. The useful watchlist therefore
  splits pure-play hashprice exposure from AI / HPC lease-duration economics.
