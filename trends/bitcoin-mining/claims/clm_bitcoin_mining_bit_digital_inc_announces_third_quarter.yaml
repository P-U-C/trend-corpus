claim: "In its November 12, 2026 press release for Q3 2026, Bit Digital, Inc. (Nasdaq: BTBT) reported digital asset mining revenue of $2.0 million on 28.4 bitcoin mined, versus $7.4 million on 64.9 bitcoin in Q3 2025, with nine-month mining revenue down 63% year over year and a Q3 segment gross margin of approximately 27%. The company stated mining remains gross margin positive but is no longer a strategic growth priority and that it does not expect to allocate meaningful growth or maintenance capital to the segment going forward, describing a continued winddown. Total Q3 2026 revenue was $27.1 million (down 11% year over year) with colocation revenue of $5.6 million (up 232%) driven by MTL-3 and the first 20 MW at WhiteFiber's NC-1 campus, and ETH staking revenue of $1.0 million. Bit Digital held 163,725.9 ETH ($439.4 million at $2,684/ETH) and 27,043,750 WhiteFiber (Nasdaq: WYFI) shares, or 59.7%, implying roughly $487 million at the September 30, 2026 close of $18.01."
