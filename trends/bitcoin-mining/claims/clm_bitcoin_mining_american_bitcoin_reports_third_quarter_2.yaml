claim: "American Bitcoin Corp. (Nasdaq: ABTC), a majority-owned subsidiary of Hut 8 Corp., reported Q3 2026 revenue of $63.355 million and net income of $125.987 million (Adjusted EBITDA $220.797 million), versus Q2 2026 revenue of $67.015 million and a net loss of $57.151 million, with the swing driven by a $197.3 million gain on digital assets partly offset by a $64.3 million loss on derivatives. The company mined ~891 Bitcoin in Q3 2026 at a cost to mine of ~$42,100 per Bitcoin, up from ~$36,500 in Q2 2026 on higher seasonal power costs, cutting gross margin to ~41% from ~49%. Bitcoin holdings rose from ~8,002 at June 30, 2026 to ~8,427 at September 30, 2026 (including ~3,090 pledged for BITMAIN miner purchases), and Satoshis Per Share rose ~5% from ~10,989 to ~11,572 with no ATM share issuance or Bitcoin purchases during the quarter, reflecting a 1-for-15 reverse stock split effected July 2, 2026. The owned fleet totaled ~89,242 miners and ~28.1 EH/s at quarter-end."
