id: wl_bitcoin_mining_hashprice_asic_hpc
title: Bitcoin-mining hashprice, ASIC, power, and AI / HPC watchlist
monitor_for:
  - Hashprice in dollars per PH per day from Hashrate Index, including 4-week streaks below miner cash-cost thresholds
  - BTC spot price, block subsidy, transaction fees, network difficulty, and next halving-cycle context
  - Bitmain Antminer S21 / S21 XP and MicroBT Whatsminer delivery schedules, firmware updates, tariff exposure, and landed-cost changes
  - Quarterly fleet hashrate, fleet efficiency, cash cost per coin, and BTC treasury disclosures from MARA, RIOT, CLSK, HUT, WULF, IREN, BITF, CIFR, HIVE, BTBT, CORZ, and ARBK
  - ERCOT large flexible load registration, Texas SB 6 rulemakings, curtailment credits, interconnection delays, and power-credit disclosures
  - New York proof-of-work GEIS, moratorium follow-ons, and state-level mining excise tax or environmental-permit proposals
  - Hyperscaler AI / HPC lease announcements, customer-concentration updates, rent-commencement milestones, and cancellations at CORZ, HUT, IREN, WULF, CIFR, BTBT, HIVE, and BITF
  - ASIC manufacturer results and capacity signals from Canaan plus private-market checks on Bitmain and MicroBT supply concentration
schema_version: 1
