id: wl_nuclear_smr_fuel_ppa_stack
title: Nuclear SMR fuel and PPA stack watchlist
monitor_for:
  - NRC licensing milestones for Oklo, NuScale, GE Vernova Hitachi, TerraPower, Kairos, and X-energy projects
  - DOE HALEU Availability Program updates, task orders, allocations, and domestic enrichment capacity announcements
  - Hyperscaler nuclear PPA and development-agreement flow from Microsoft, Amazon, Google, Meta, Oracle, and data-center operators
  - Uranium spot and long-term contract pricing, plus Cameco, UEC, and NexGen contracting commentary
  - SMR pure-play quarterly cash runway, backlog, customer commitments, and project cost updates
  - Utility incumbent nuclear restart, uprate, license extension, and data-center colocation announcements
schema_version: 1
