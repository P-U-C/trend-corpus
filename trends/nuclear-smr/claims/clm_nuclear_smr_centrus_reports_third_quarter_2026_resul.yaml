claim: "Centrus Energy Corp. (NYSE: LEU) reported Q3 2026 revenue of $55.5 million, down 26% from $74.9 million in Q3 2025, with GAAP net income of $31.6 million (driven mainly by a $46.4 million gain on fair value adjustment of warrant liabilities) versus a non-GAAP adjusted net loss of $9.4 million. Total backlog was $7.0 billion as of September 30, 2026, extending to 2040, including approximately $6.2 billion in the LEU segment and roughly $5.4 billion of contingent LEU and HALEU commitments ($5.1 billion under definitive agreements) tied to potential Piketon, Ohio capacity construction. Centrus completed manufacturing and began shipping centrifuges from Oak Ridge, Tennessee, finalized all supply-chain-critical contracts, and completed its first certified-for-construction package ahead of year-end targets, and guided full-year 2026 revenue of $450-500 million with capital deployment of $350-500 million. The DOE's proposed fiscal 2027 budget excludes further funding for HALEU cascade operation under the 2022 HALEU Operation Contract, which represents about $0.8 billion of Technical Solutions backlog, and DOE has stated it does not currently intend to exercise further options."
