claim: "On September 22, 2026, SGE, GE Vernova, Hitachi and Samsung C&T signed a Memorandum of Understanding in New York establishing a framework for cooperation on market development and commercial opportunities for deploying the BWRX-300 small modular reactor in Central and Eastern Europe and the United Kingdom. The MoU names GE Vernova Hitachi Nuclear Energy as the BWRX-300 designer and technology provider, Hitachi GE Vernova Nuclear Energy as contributing nuclear technology and industrial expertise, Samsung C&T as contributing engineering and construction capabilities, and SGE as developing a European BWRX-300 fleet and acting as exclusive regional lead for much of Central and Eastern Europe."
