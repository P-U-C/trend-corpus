claim: "Oklo Inc. (NYSE: OKLO) signed multiple definitive multi-year contracts with Centrus Energy Corp. (NYSE: LEU) for high-assay low-enriched uranium, including Oklo prepayments that fund new U.S. enrichment capacity, formalizing a June 2026 letter of intent. Deliveries from Centrus' American Centrifuge Plant in Pike County (Piketon), Ohio begin in 2029, covering enough HALEU for up to five Aurora powerhouses for multiple years, the first phase of Oklo's planned 1.2 GW Ohio campus, future Aurora projects, and later refueling of Aurora-INL. The HALEU purchase is funded by Meta's prepayment for future Oklo power production, under an agreement linking prepayment to project development milestones. Centrus states it has now secured $5.4 billion in customer contracts and commitments for LEU and HALEU from the new capacity and has begun shipping its first new centrifuge."
