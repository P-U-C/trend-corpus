id: ths_nuclear_smr_fuel_ppa_stack
title: Nuclear scarcity links fuel, licensing, and data-center PPAs
summary: >
  Nuclear and SMR exposure is becoming deconstructable into three public
  signals: licensing progress, fuel-cycle scarcity, and contracted data-center
  demand. Pure-play reactor developers carry high milestone risk, fuel-cycle
  names capture HALEU and uranium bottlenecks, and utility incumbents capture
  near-term PPA economics where existing nuclear assets can be contracted or
  restarted. The useful watchlist is therefore a stack of fuel, licensing, and
  PPA beneficiaries rather than a single SMR ticker list.
