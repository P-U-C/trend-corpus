summary: >
  Tracks public-market exposure to nuclear-power expansion and small modular
  reactors: advanced reactor developers, large-reactor and SMR incumbents,
  nuclear-exposed utilities, uranium mining, conversion, enrichment, fuel-fab,
  HALEU supply, and data-center power purchase agreements. The theme is
  growing because policy support and hyperscaler demand are now visible, while
  licensing and fuel-cycle constraints still gate deployment timing.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain nuclear
  proliferation guidance, construction-engineering advice, licensing-application
  drafting, private order intent, account details, execution instructions, or
  non-public technical data.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
