id: ths_ai_infra_bottleneck_stack
title: The investable AI infrastructure stack is bottleneck-driven
summary: >
  AI infrastructure is already a peak-hype theme, so the useful public signal is
  not whether AI demand exists but where bottlenecks move next. Export controls
  constrain geography, HBM and advanced packaging constrain accelerator supply,
  and hyperscaler capex pull-through shows up across accelerator, custom
  silicon, server, networking, and power/cooling vendor disclosures. The cleaner
  watchlist is therefore a stack of bottleneck beneficiaries rather than a
  single GPU-only list.
