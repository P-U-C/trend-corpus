claim: "Latitude Intelligence, whose research platform launched the week of November 10, 2026, tracks 120 GW of signed (executed service agreement) data center load across 53 utility territories versus 22 GW of operating data center load in the same footprint, against 537 GW of reported pipeline load. AEP Ohio holds the most signed load of any tracked territory at 235% of its current peak, with NIPSCO at 169% and PPL at 145%; Georgia Power shows 12.8 GW signed against 80.1 GW reported. Open or contemplated generation procurements across the six largest tracked utilities total 37 GW, including Dominion's solicitation of up to 7.3 GW of dispatchable generation with submissions due December 18 and in-service dates through 2036, Georgia Power's 2\u20136 GW, and AEP solicitations of 4 GW each for Indiana Michigan Power and Public Service Company of Oklahoma. Announcement-to-first-power averaged 33 months across 14 projects energized since late 2021 (19 projects with data, outliers excluded), and five regional grid operators must answer FERC's large load show-cause orders by November 16, 2026, with SPP's response due November 20."
