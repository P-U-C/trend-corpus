claim: "On July 29, 2026, the U.S. Department of Commerce announced 7 letters of intent for up to $874 million in CHIPS and Science Act federal incentives to GlobalFoundries, Kepler, Multibeam Corporation, Extropic, Thintronics, OBSIDIA Semiconductors, and Aeluma for semiconductor R&D in the compute supply chain. The letters of intent cover up to $300 million for GlobalFoundries, $245 million for Kepler, $140 million for Multibeam Corporation, $75 million for Extropic, $50 million for Thintronics, $34 million for OBSIDIA Semiconductors, and $30 million for Aeluma, with final awards subject to further Department of Commerce diligence and approval and conditioned on the Department receiving minority, non-controlling equity stakes."
