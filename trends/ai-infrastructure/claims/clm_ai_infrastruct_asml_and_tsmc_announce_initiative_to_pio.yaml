claim: "ASML Holding N.V. and TSMC announced on September 8, 2026 that they established an industry-wide initiative on September 7, 2026 to transition High NA EUV lithography from current 6-inch photomasks to larger 12-inch photomasks. The initiative targets a 12-inch mask pilot line by 2031 and readiness for 12-inch High NA lithography systems to enter advanced-node production by 2033; TSMC also stated it intends to use ASML High NA technology in high-volume manufacturing for advanced nodes starting in 2030."
