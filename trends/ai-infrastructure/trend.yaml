summary: >
  Tracks the public market structure around AI data-center infrastructure:
  accelerators, custom AI silicon, foundry and advanced packaging capacity,
  high-bandwidth memory, networking silicon, optical and rack connectivity,
  AI servers, and data-center power and cooling. The theme is already in
  peak-hype status, so the corpus emphasizes verifiable bottlenecks,
  regulatory constraints, and demand-cycle monitoring rather than simple
  narrative discovery.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain private order
  intent, account details, execution instructions, procurement guidance, or
  non-public customer information.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
