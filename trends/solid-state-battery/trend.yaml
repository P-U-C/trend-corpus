summary: >
  Tracks public-market exposure to the solid-state lithium battery transition:
  the U.S. SPAC cohort that still trades as the closest pure-plays
  (QuantumScape, Solid Power, SES AI), the Asian incumbents racing to mass
  production (Toyota, Samsung SDI, SK On / SK Innovation, LG Energy Solution),
  the ceramic-separator ecosystem around Murata Manufacturing,
  the Japanese sulfide-electrolyte supply oligopoly that gates every sulfide
  cell program (Idemitsu Kosan, Mitsui Mining and Smelting), and the private
  keystones whose fundraise marks reprice the public cohort
  (Factorial Energy, Ampcera, 24M Technologies, Sila Nanotechnologies,
  ProLogium Technology, ION Storage Systems). The theme is emerging because
  Q1 2026 marked the first sustained customer-billings signal from
  solid-state cells (QuantumScape Eagle Line) even as the volume
  mass-production wall remains a 2027 to 2029 problem and is gated upstream
  by electrolyte and separator capacity.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain private cell
  recipes, non-public OEM supply terms, undisclosed safety incident records,
  pre-publication test data, non-public order intent, account details,
  laboratory infrastructure security details, or non-public M&A information.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
