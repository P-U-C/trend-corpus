notes: Arizona-based sulfide-electrolyte materials supplier. ~20 ton/yr pilot today, scaling toward 1000 tons by 2027 with a U.S. SSB pilot line commissioning in 2026. The most credible non-Japanese sulfide-electrolyte option and a potential supplier-diversification beneficiary as U.S. policy pushes domestic battery content.
