notes: Arizona-based sulfide-electrolyte materials supplier. Current public materials confirm a 20 ton/yr solid-electrolyte pilot facility, a pre-pilot battery R&D / prototyping line, and a 2026 U.S. SSB pilot-line buildout. The most credible non-Japanese sulfide-electrolyte option and a potential supplier-diversification beneficiary as U.S. policy pushes domestic battery content.
