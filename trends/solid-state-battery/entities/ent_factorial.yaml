notes: Private semi-solid to solid-state developer headquartered in Woburn, MA. Supplied cells used by Mercedes-Benz for the 749-mile EQS demonstration drive in 2025. Roadmap moves from semi-solid commercial in 2026 toward all-solid by 2028. OEM partners include Mercedes-Benz, Stellantis, and Hyundai-Kia.
