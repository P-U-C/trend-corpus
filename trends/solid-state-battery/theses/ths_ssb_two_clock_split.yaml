id: ths_ssb_two_clock_split
title: Solid-state battery is a two-clock sector with sulfide-electrolyte supply as the binding upstream constraint
summary: >
  Solid-state battery is a two-clock sector. The fast clock is the U.S. pure-play
  commercial-billings cadence: QuantumScape Eagle Line throughput and PowerCo
  joint-development milestones, Solid Power's sulfide-electrolyte licensing
  revenue under Samsung SDI and BMW, and SES AI's NDAA-compliant lithium-metal
  drone-cell shipments. The slow clock is the Asian incumbent mass-production
  roadmap: Toyota / Idemitsu, Samsung SDI / BMW / Solid Power, SK On / SK
  Innovation, LG Energy Solution, all converging on a 2027-2028 commercial
  window. Both clocks are gated upstream by a tight Japanese sulfide-electrolyte
  oligopoly (Idemitsu Kosan and Mitsui Mining and Smelting), whose announced
  pilot and mass-production tonnage covers an order of magnitude fewer EVs than
  the published cell programs. Private keystones (Factorial, Ampcera, 24M, Sila)
  reprice both clocks by 12-24 months ahead of the public cohort through OEM
  demonstration drives and fundraise marks. The useful watchlist combines
  pure-play customer-billings cadence, Asian incumbent program-of-record
  disclosures, Japanese sulfide-supply capacity additions, and private-keystone
  fundraise marks plus OEM demonstration events.
