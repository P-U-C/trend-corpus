id: ths_ssb_two_clock_split
title: Solid-state battery is a two-clock sector with sulfide-electrolyte supply as the binding upstream constraint
summary: >
  Solid-state battery is a two-clock sector. The fast clock is the U.S. pure-play
  customer-billings cadence: QuantumScape Eagle Line throughput and PowerCo
  joint-development milestones, Solid Power's electrolyte sampling and
  joint-evaluation milestones with Samsung SDI / BMW plus SK On, and SES AI's
  NDAA-compliant lithium-metal drone-cell shipments. The slow clock is the Asian
  incumbent mass-production roadmap: Toyota / Idemitsu and Samsung SDI / BMW /
  Solid Power form the 2027-2028 first wave, while SK On / SK Innovation and LG
  Energy Solution are later-decade programs. Both clocks are gated upstream by a
  tight Japanese sulfide-electrolyte oligopoly (Idemitsu Kosan and Mitsui Mining
  and Smelting), whose announced pilot and early mass-production tonnage is still
  small relative to EV-scale programs. Private keystones (Factorial, Ampcera,
  24M, Sila, ProLogium, ION Storage Systems) reprice both clocks by 12-24 months
  ahead of the public cohort through OEM demonstration drives, customer
  qualification events, and fundraise marks. The useful watchlist combines
  pure-play customer-billings cadence, Asian incumbent program-of-record
  disclosures, Japanese sulfide-supply capacity additions, Murata / Corning
  separator-scale signals, and private-keystone fundraise marks plus OEM
  demonstration events.
