id: clm_ssb_doe_lpo_45x_domestic_content
claim: U.S. DOE Loan Programs Office Title 17 and ATVM commitments combined with IRA Section 45X manufacturing tax credits
  substantially change the economics of U.S.-sited solid-state pilot and early commercial lines. The regulatory layer creates
  a tradable distinction between QuantumScape and Solid Power (U.S.-sited cell and electrolyte work) and Ampcera (U.S. sulfide
  electrolyte) on one hand, and Asian-sited programs (Toyota, Samsung SDI, SK On) on the other. The IRA 45X interpretive guidance
  for cell components is the leading regulatory signal worth tracking on quarterly cadence.
