claim: "On September 24, 2026, ChemElectroChem published Chanho Kim, Ella Williams-Smith, Andre Adam, Ampcera Inc.\u2019s Eongyu Yi and Jaewon Kim, Yi-Feng Su, Lei Cheng, and Guang Yang\u2019s study of dry-processed NMC811/Li6PS5Cl sulfide solid-state battery cathodes using a Si anode and NMC811 mass loading of 17.85 mg cm\u22122. The study found that 2\u20133 \u00b5m LPSCl catholyte retained 92.6% capacity after 100 cycles at 0.4 mA cm\u22122, while nano LPSCl failed before 100 cycles and 3\u20135 \u00b5m LPSCl retained 85.4%, with FIB\u2013SEM, EIS/DRT, and GITT linking those results to catholyte-size-dependent microstructure and impedance."
