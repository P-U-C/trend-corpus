id: clm_ssb_japanese_sulfide_oligopoly
claim: Sulfide-electrolyte and lithium-sulfide precursor capacity is concentrated in two Japanese suppliers (Idemitsu Kosan and Mitsui Mining and Smelting) whose announced 2026-2027 pilot and mass-production capacity covers an order of magnitude fewer EVs than the published Toyota, Samsung SDI, and SK On 2027-2028 cell roadmaps. The binding constraint on commercial sulfide solid-state output is therefore upstream electrolyte tonnage, not cell-line throughput; Ampcera's U.S. scaling and any non-Japanese sulfide entrant become disproportionately important supply-diversification beneficiaries.
