id: clm_ssb_japanese_sulfide_oligopoly
claim: Sulfide-electrolyte and lithium-sulfide precursor capacity is concentrated in two Japanese suppliers (Idemitsu Kosan
  and Mitsui Mining and Smelting) whose announced 2026-2027 pilot and early mass-production capacity is still small relative
  to the Toyota and Samsung SDI 2027-2028 first-wave programs and the Korean late-decade solid-state roadmaps. The binding
  constraint on commercial sulfide solid-state output is therefore likely to be upstream electrolyte tonnage as much as cell-line
  throughput; Ampcera's U.S. scaling and any non-Japanese sulfide entrant become disproportionately important supply-diversification
  beneficiaries.
