claim: "In ACS Applied Energy Materials on September 5, 2026, Wei Guo, Zhiyou Yu, Lin Hua, Jiachen Xu, Jun Wu of GAC Aion New Energy Automobile Co., Ltd., and coauthors at Wuhan University of Technology reported that Li6PS5Cl particle size and CAM/SSE volume ratio control interfacial transport kinetics in sulfide all-solid-state composite cathodes using high-Ni NCM90. Their LAMMPS three-dimensional simulations and multiscale characterization found refined Li6PS5Cl reduced Li-ion tortuosity and improved ionic continuity while increasing electronic-pathway tortuosity, and a 50:50 CAM/SSE volume ratio maintained 65.8% capacity after 2C cycling when returned to low rate."
