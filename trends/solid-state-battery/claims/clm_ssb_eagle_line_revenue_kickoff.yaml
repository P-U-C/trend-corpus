id: clm_ssb_eagle_line_revenue_kickoff
claim: QuantumScape inaugurated its automated Eagle Line on 2026-02-04 and recorded $11.0M of customer billings in Q1 2026,
  marking the first sustained customer-billings quarter for a U.S.-listed solid-state pure play and validating the licensing-model
  commercial path through PowerCo / Volkswagen Group. The billings base is still tiny relative to fully diluted market cap
  and is not GAAP revenue, but the customer-billings line is the discrete catalyst that revalues QS against an industrial
  customer-activity comparable set rather than a pre-customer-billings R-and-D comparable set.
