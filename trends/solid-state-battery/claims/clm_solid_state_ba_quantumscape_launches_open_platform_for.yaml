claim: "On 12 November 2026 QuantumScape, a Volkswagen-backed US developer, announced \"Osprey,\" an open platform for sulphide-based all-solid-state batteries that pairs its ceramic separator and anode-free lithium-metal design with either QuantumScape's own or third-party solid cathodes, enabling licensing and co-development with existing QS customers. Initial two-layer test cells reached 1,000 full cycles at roughly 80% capacity retention and 10\u201380% charging in five minutes at 1C/1C, >5 mAh/cm\u00b2 cathode loading, 100% depth of discharge, room temperature and 1 atmosphere pressure, with cell-level energy density up to approximately 1,100 Wh/L. QuantumScape states Osprey has been demonstrated only at laboratory scale and that larger prismatic automotive cells will require more layers and area, while its separate QSE-5 cell (5 Ah, over 844 Wh/l, 12.2 minutes 10\u201380% SoC) remains its first commercial product, built on the Eagle pilot line inaugurated in February 2026 in San Jose. CEO Siva Sivaram is quoted saying the goal is to make Osprey \"the leading platform for solid-state battery development.\""
