claim: "On 2026-11-11 QuantumScape published a white paper and announcement for Osprey, an all-solid-state platform that keeps its ceramic separator and anode-free lithium-metal design but replaces the liquid catholyte of its QSE/QSE-5 cells with a solid sulfide catholyte. A 2-layer cell with a 50 x 65 mm cathode at 5.5 mAh/cm\u00b2 loading ran 1,000 full 1C/1C cycles to about 80% capacity at 30\u00b0C and 1 atm, roughly 0.3\u20130.4 Ah versus about 5 Ah for QSE-5. Other headline figures are narrower: the \"five-minute 10\u201380% charge\" was measured at 10C and 80\u00b0C, -20\u00b0C operation (68% of room-temperature capacity) came from a single-layer 21 x 21 mm cell at C/3, and the ~1,100 Wh/L figure is a projection backed by a 100-cycle 11 mm coin cell at 3 atm, against QSE-5's rated 844 Wh/L and 301 Wh/kg. QuantumScape reported $9.8 million in Q3 customer billings and a 100 MWh QSE-5 line targeting 2028 start of production, with no Osprey timeline and processes described as laboratory scale."
