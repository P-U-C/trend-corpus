id: wl_ssb_manufacturing_and_supply
title: Solid-state battery manufacturing and sulfide-supply watchlist
monitor_for:
  - QuantumScape quarterly customer-billings, Eagle Line throughput updates, and PowerCo / Volkswagen Group joint-development milestone disclosures
  - Solid Power quarterly SK On revenue, electrolyte sampling, Samsung SDI / BMW joint-evaluation progress, and BMW joint-development milestones
  - SES AI Corp lithium-metal drone-cell shipment volume, NDAA-compliant production updates, and Molecular Universe AI customer announcements
  - Toyota and Samsung SDI program-of-record disclosures and any movement of the 2027-2028 first-wave mass-production dates, plus SK On and LG Energy Solution later-decade solid-state commercialization targets
  - Idemitsu Kosan and Mitsui Mining and Smelting sulfide-electrolyte and lithium-sulfide capacity additions, completion dates, and announced offtake agreements
  - Murata and Corning separator-scale collaboration milestones tied to QuantumScape's ceramic separator ecosystem
  - Ampcera, 24M Technologies, Factorial, Sila Nanotechnologies, ProLogium, and ION Storage Systems fundraise marks, OEM demonstration disclosures, customer qualification events, and U.S. domestic-content pilot-line milestones
  - DOE Loan Programs Office (Title 17, ATVM) award flow tied to solid-state pilot and commercial lines and IRS / Treasury IRA 45X interpretive guidance touching battery-cell component eligibility
  - Peer-reviewed energy-density, cycle-life, and dendrite-suppression benchmarks for sulfide, oxide, and polymer architectures (J. Power Sources, Nature Energy, Joule)
schema_version: 1
