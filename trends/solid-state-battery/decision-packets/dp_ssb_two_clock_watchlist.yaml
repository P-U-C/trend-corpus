id: dp_ssb_two_clock_watchlist
question: Should the metalayer maintain a watchlist of U.S. solid-state pure plays plus Japanese sulfide-electrolyte suppliers plus private keystones, tracked against the QuantumScape Eagle Line customer-billings cadence and the Asian incumbent 2027-2029 mass-production roadmap?
verdict: watchlist_candidate
execution_state: human_review_required
supporting_theses:
  - ths_ssb_two_clock_split
supporting_claims:
  - clm_ssb_eagle_line_revenue_kickoff
  - clm_ssb_japanese_sulfide_oligopoly
  - clm_ssb_doe_lpo_45x_domestic_content
invalidation_conditions:
  - QuantumScape customer-billings line declines for two consecutive quarters or PowerCo unilaterally pauses the joint-development program, breaking the manufacturing-clock catalyst that anchors the pure-play revaluation.
  - Toyota or Samsung SDI publicly slips its 2027-2028 first-wave mass-production target by more than 24 months, or SK On / LG Energy Solution publicly slips its later-decade solid-state commercialization target past 2031 with no replacement program-of-record, collapsing the slow-clock revaluation case.
  - Idemitsu Kosan, Mitsui Mining and Smelting, Ampcera, or another bankable supplier publicly commits sulfide-electrolyte or lithium-sulfide capacity of at least 30 GWh-equivalent per year by 2029, eliminating the supply-constraint argument and changing pricing-power dynamics.
  - U.S. domestic-content rules (IRA 45X interpretive guidance or DOE LPO commitment criteria) materially loosen or are suspended, eliminating the regulatory premium for U.S.-sited cell and electrolyte work.
  - A non-sulfide solid-state architecture (oxide LLZO or polymer hybrid) achieves either at least $10M of quarterly customer billings or OEM-qualified shipments of automotive-format cells within a 12-month horizon, broadening the credible chemistry set and reducing the strategic value of the Japanese sulfide oligopoly.
schema_version: 1
