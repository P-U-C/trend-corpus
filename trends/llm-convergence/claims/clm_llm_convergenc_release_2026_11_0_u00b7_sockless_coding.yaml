claim: "The sockless-coding/llm-router open-source project released version 2026.11.0 on 2026-11-08, adding vLLM as a backend engine alongside llama.cpp and stable-diffusion.cpp, with WSL-based installs on Windows using uv and Python 3.12 and presets driven by recipes read from recipes.vllm.ai. The release also introduces a self-contained LR.Agent service for Windows and Linux (x64/arm64) that dials out to the router over WebSocket to run inference servers on remote machines behind NAT, with per-agent hashed secrets and SHA-256-verified self-updates. It adds GGUF-metadata model-type classification (Chat, Embedding, Reranker, Decision, Image, Projector, ImageComponent) and a new /v1/systemone decision endpoint. Stated limitations: Strata servers cannot run on agents, remote backends listen on 0.0.0.0 without their own HTTP auth, and vLLM exposes no llama.cpp-style /props or /slots, so slot and KV usage are not shown, with in-flight requests bounded by a default 64 max concurrent requests."
