claim: "Oracle's October 9, 2026 OCI update states that xAI Grok 4.6 and Grok 4.7 are available for on-demand inference in OCI Enterprise AI, and that September Model Import additions include Alibaba Qwen3.8-27B and Qwen3.5-397B-A17B, DeepSeek V4 Pro 0813 and V4.1 Flash, Google Gemma 4 31B IT and Gemma 4 26B A4B IT, and Z.ai GLM-5.3 and GLM-5.3-Flash. Oracle also shipped Smart Model Router, which routes on-demand inference across customer-selected OCI regions via a routing profile used with the Chat API or Responses API, plus Model Discovery API access to per-region model capabilities, serving options, and retirement dates. The OCI Responses API now calls imported models starting with Alibaba Qwen3.6-35B-A3B and Google Gemma 4 31B IT, OCI IAM policies can allow or exclude specific model IDs or patterns per group, and Cohere Command A Vision and Embed 4 are live for on-demand and dedicated AI cluster inference in UAE East (Dubai)."
