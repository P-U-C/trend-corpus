claim: "Rigetti Computing (Nasdaq: RGTI) reported Q3 2026 revenue of $1.411 million versus $1.947 million in Q3 2025, a $33.186 million loss from operations, and GAAP net loss of $3.137 million, with the smaller net loss driven by a $25.291 million gain from change in fair value of derivative warrant liabilities; nine-month 2026 revenue was $10.949 million versus $5.220 million in 2025. As of September 30, 2026 the company held $497.1 million in cash, cash equivalents and available-for-sale investments with no debt, and guided to approximately $20 million of full-year 2026 revenue contingent on C-DAC customer acceptance in Q4. Rigetti stated its Cepheus-1-108Q system, built from twelve interconnected 9-qubit chiplets, achieved 99.5% median two-qubit gate fidelity (99.6% on an 80-qubit sublattice, 99.7% on a 50-qubit sublattice), and targets a 300-plus-qubit system at ~99.7% fidelity by mid-2028. In September 2026 Rigetti signed a definitive agreement with the U.S. Department of Commerce for an award of up to $100 million under the CHIPS R&D Office Broad Agency Announcement, under which the Department received a minority, non-controlling equity stake."
