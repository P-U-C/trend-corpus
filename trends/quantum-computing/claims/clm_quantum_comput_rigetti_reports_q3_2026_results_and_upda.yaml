claim: "Rigetti Computing (Nasdaq: RGTI) reported Q3 2026 revenue of $1.4 million, an operating loss of $33.2 million, GAAP net loss of $3.1 million ($0.08 diluted), and $497.1 million in cash, cash equivalents and available-for-sale investments with no debt as of September 30, 2026; nine-month revenue was $10.9 million versus $5.2 million a year earlier, and full-year 2026 revenue is guided to approximately $20 million contingent on C-DAC customer acceptance in Q4. Its 108-qubit Cepheus-1-108Q system, built from 12 interconnected 9-qubit chiplets, hit 99.5% median two-qubit gate fidelity, with 99.6% on an 80-qubit sublattice and 99.7% on a 50-qubit sublattice, at gate speeds of 50-70 nanoseconds. CEO Subodh Kulkarni stated the next system objective is a 300-plus-qubit system at approximately 99.7% median two-qubit gate fidelity and sub-60-nanosecond gate speeds by mid-2028, on a path to approximately 1,000 qubits at 99.9% fidelity within about three years. In September 2026 Rigetti signed a definitive agreement with the U.S. Department of Commerce for an award of up to $100 million under the CHIPS R&D Office Broad Agency Announcement, under which the Department received a minority, non-controlling equity stake."
