summary: >
  Tracks the public market structure around quantum-computing hardware,
  enabling systems, and credible platform milestones: trapped-ion systems,
  superconducting systems, annealing, photonic and neutral-atom approaches,
  cryogenic and control infrastructure, cloud access points, and listed
  quantum pure plays. The theme is in peak-hype status because small public
  names already react sharply to benchmark, capital-raise, and roadmap news.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain private order
  intent, account details, execution instructions, export-control evasion
  guidance, procurement guidance, or non-public technical data.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
