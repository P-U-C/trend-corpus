id: wl_quantum_fidelity_stack
title: Quantum fidelity and supply-stack watchlist
monitor_for:
  - Two-qubit gate fidelity, logical-qubit, and error-correction benchmarks from Google, IBM, IonQ, Rigetti, D-Wave, and Microsoft
  - BIS export-control updates touching quantum computers, cryogenic systems, quantum sensors, or related enabling technologies
  - NIST post-quantum cryptography migration milestones and federal guidance deadlines
  - Bluefors and Oxford Instruments capacity, lead-time, and cryogenic-platform announcements
  - Pure-play quarterly cash burn, bookings, revenue, backlog, and financing runway for IONQ, QBTS, RGTI, ARQQ, and QUBT
  - Private-company milestones from PsiQuantum, PASQAL, and IQM that could re-rank public technology narratives
schema_version: 1
