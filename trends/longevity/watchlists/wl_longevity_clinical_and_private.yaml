id: wl_longevity_clinical_and_private
title: Longevity clinical and private-marks watchlist
monitor_for:
  - BioAge Labs quarterly business updates, BGE-102 Phase 1 / Phase 2 readout calendar, oral / parenteral APJ agonist IND submissions, and cash runway
  - Unity Biotechnology liquidation completion timeline as a closure data point on the senolytic / DME translation hypothesis
  - AbbVie post-Calico strategy disclosures and any rumor of replacement longevity partnership; Alphabet earnings commentary on Calico funding
  - Eli Lilly investor commentary on NewLimit and on GLP-1 longevity / healthspan messaging; Novo Nordisk GLP-1 long-term-cardiovascular and aging-endpoint readouts
  - Insilico Medicine post-IPO 6-K disclosures, aging-indications Phase 1 / Phase 2 readouts
  - Altos Labs press releases on first-in-human dosing and clinical-trial-site activations; any follow-on funding mark
  - Calico Life Sciences press on independent funding or replacement partner; pipeline candidate IND clearance announcements
  - Loyal commercial launch progress for the FDA conditionally approved canine longevity therapeutic and pipeline IND filings
  - Retro Biosciences RTR242 Alzheimer's trial cohort progression and any follow-on OpenAI-collaboration deliverable
  - NewLimit clinic-ready announcement plus follow-on funding mark
  - Life Biosciences and Rejuvenate Bio first-in-human disclosures
  - FDA CBER cellular and gene therapy guidance updates touching partial reprogramming, AAV Yamanaka factor combinations, or aging clinical endpoints
  - Peer-reviewed publications on aging biomarkers (epigenetic clocks, GrimAge / PhenoAge), senolytic combination chemistry, and rapamycin-class repurposing
schema_version: 1
