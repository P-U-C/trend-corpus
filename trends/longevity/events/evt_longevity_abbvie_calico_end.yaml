notes: The single most consequential adverse corporate event in the public longevity surface in 2025-2026. Reduces large-cap incumbent capital exposure to the sector and shifts Calico to standalone funding. Cumulative $3.5B AbbVie-Calico funding ended after fosigotifator ALS Phase 2 endpoint miss early 2025. Re-rates BioAge Labs as the only credible US-listed pure play and increases the importance of private-keystone marks as the leading revaluation signal.
