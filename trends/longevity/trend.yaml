summary: >
  Tracks public-market exposure to the longevity and biological-aging
  therapeutics sector: the small public near-pure-play universe (BioAge
  Labs as the most credible US-listed pure play; Unity Biotechnology as
  the distressed senolytic precedent now in wind-down), the AI-bio
  longevity adjacency that listed on HKEX (Insilico Medicine), large-cap
  pharma whose longevity exposure is investor or acquirer optionality
  rather than a P-and-L driver (AbbVie post-Calico exit, Alphabet as
  Calico parent, Eli Lilly as NewLimit investor + GLP-1 obesity halo,
  Novo Nordisk via GLP-1), and the privately-held longevity cohort whose
  fundraise marks and pre-clinical milestones lead the public revaluation
  (Altos Labs, Calico Life Sciences, Loyal, Retro Biosciences, NewLimit,
  Life Biosciences, Rejuvenate Bio). The theme is emerging because
  partial epigenetic reprogramming therapies entered human clinical
  trials in 2025-2026 (the first-ever cellular reprogramming IND clear)
  even as the AbbVie-Calico partnership ended (November 2025) and Unity
  Biotechnology shareholders approved liquidation (September 2025) -
  the venture validation is real but the public investable surface is
  small and binary.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain non-public
  clinical trial data, non-public IND submission contents, proprietary
  cell-reprogramming recipes, FDA non-public correspondence, non-public
  off-label rapamycin prescribing data, individual patient identifiers,
  non-public order intent, account details, or non-public M&A or
  licensing terms.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
