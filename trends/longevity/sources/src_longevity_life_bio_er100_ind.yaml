notes: Life Biosciences January 2026 announcement that FDA cleared the ER-100 IND, allowing a Phase 1 first-in-human study in open-angle glaucoma and non-arteritic anterior ischemic optic neuropathy. The company describes ER-100 as the first cellular rejuvenation therapy using partial epigenetic reprogramming to receive FDA clearance to enter human clinical trials.
