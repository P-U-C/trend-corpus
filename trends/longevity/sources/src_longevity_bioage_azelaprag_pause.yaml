notes: BioAge Labs December 2024 discontinuation press for STRIDES Phase 2 azelaprag plus tirzepatide combination in obesity, citing liver transaminitis observations without clear dose dependence. January 2025 follow-up terminated azelaprag development entirely and advanced structurally distinct APJ agonists.
