notes: >
  ClinicalTrials.gov record for the PEARL trial (Participatory Evaluation
  of Aging with Rapamycin for Longevity), 114 participants aged 50-85 over
  48 weeks randomized double-blind placebo-controlled at 5mg or 10mg
  compounded rapamycin weekly. Topline results published April 2025 --
  low-dose rapamycin safe and well-tolerated; women at 10mg gained lean
  muscle and reported reduced pain; 5mg group reported improved emotional
  well-being.
