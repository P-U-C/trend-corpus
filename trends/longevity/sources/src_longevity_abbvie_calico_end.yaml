notes: Fierce Biotech coverage of the November 2025 AbbVie decision to end the 11-year Calico Life Sciences partnership and lay off approximately 100 scientists. The collaboration carried up to $3.5B in total potential joint commitments, while AbbVie disclosed $1.75B invested through 2022. Driven by AbbVie strategy pivot toward genetic medicines following Calico fosigotifator ALS Phase 2/3 endpoint miss in early 2025.
