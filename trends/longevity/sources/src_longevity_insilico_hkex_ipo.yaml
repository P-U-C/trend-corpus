notes: Insilico Medicine listed on HKEX on December 30, 2025 under 3696.HK. The IPO raised HKD 2.277B, approximately $293M, making it Hong Kong's largest biotech IPO of 2025 and the first AI-driven biotech Main Board listing under Chapter 8.05. Internal pipeline includes aging-related indications (idiopathic pulmonary fibrosis, dermatology, fibrosis).
