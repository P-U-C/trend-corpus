id: ths_longevity_thin_public_private_led
title: Longevity is a private-led, clinical-readout-binary sector with a contracting public surface and a single near-pure-play
summary: >
  Longevity is a private-led sector in 2026. The fast clock is private
  fundraise and clinical-milestone cadence: NewLimit at $1.62B
  valuation with Eli Lilly participation, Life Biosciences entering the
  clinic with ER-100 after the first public partial-reprogramming IND
  clearance, Retro Biosciences entering the clinic with RTR242 after a
  50x AI-engineered increase in expression of stem-cell reprogramming
  markers, and Loyal with FDA reasonable-expectation-of-effectiveness
  acceptance for LOY-002 and two of three major technical sections
  complete toward expanded conditional approval. The medium clock is the contraction
  of the public investable surface: AbbVie ended the 11-year $3.5B
  Calico partnership in November 2025, Unity Biotechnology approved
  liquidation in September 2025, leaving BioAge Labs (BIOA) as the
  only credible US-listed near-pure-play navigating its own December
  2024 azelaprag pause and 2025 pivot to BGE-102 NLRP3 plus APJ agonist
  programs. The slow clock is regulatory: FDA CBER review for the first
  public partial-reprogramming IND clearance in 2026 is the structural
  signal that makes 2026 the regulatory inflection year. Large-cap
  pharma exposure runs through Alphabet (Calico parent), Eli Lilly
  (NewLimit follow-on investor plus the GLP-1 obesity halo), and Novo
  Nordisk (GLP-1 halo) at single-digit-percent slice-of-top-line
  exposure. The useful watchlist combines (a) BioAge BGE-102 plus APJ
  IND progression, (b) Life Biosciences ER-100 and Altos / Calico /
  NewLimit / Retro clinical or fundraise disclosures, (c) Loyal approval
  and commercial launch progress, (d) FDA CBER approvals / clinical
  holds touching reprogramming INDs, and (e) large-cap pharma M&A flow
  signaling acquirer revaluation.
