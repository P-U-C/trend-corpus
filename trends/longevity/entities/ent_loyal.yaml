notes: Clinical-stage veterinary medicine company developing therapies to extend dog lifespan. Received FDA reasonable-expectation-of-effectiveness acceptance for LOY-002 in February 2025 and had completed two of three major technical sections toward expanded conditional approval by early 2026; FDA approval is not yet guaranteed. Three products in pipeline target underlying causes of canine aging. Raised more than $150M. Veterinary longevity is a springboard for human applications, but commercial revenue remains prospective until approval and launch.
