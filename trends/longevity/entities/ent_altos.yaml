notes: Launched 2022 with $3B initial funding (Bezos, Yuri Milner among reported lead investors), making it one of the most heavily funded biotech startups. 2024 work from Altos-linked investigators showed targeted partial reprogramming of age-associated cell states extending mouse lifespan. As of May 2026, Altos had signaled translation through product-development leadership hires but had not publicly announced IND clearance or human-trial initiation. Primary private keystone whose fundraise mark and future clinical milestones reprice the theme.
