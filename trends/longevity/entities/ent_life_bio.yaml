notes: Received FDA clearance in January 2026 for ER-100, an AAV-delivered partial epigenetic reprogramming therapy for optic neuropathies, marking the first cellular rejuvenation therapy using partial epigenetic reprogramming to enter human clinical trials. Closed an $80M financing in April 2026 to support the Phase 1 trial and broader PER platform. Smaller-cap private but currently the most advanced public reprogramming clinical timeline.
