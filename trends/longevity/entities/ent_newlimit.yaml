notes: Brian Armstrong (Coinbase) and Blake Byers co-founded developer of medicines that increase healthy human lifespan by targeting aging itself rather than individual diseases. Series B $130M plus $45M follow-on (Eli Lilly, Duke Management, Section 32) at $1.62B valuation. Discovery platform searches for combinations of transcription factors that make old cells look and act young by gene expression and functional performance. Close to clinic-ready epigenetic reprogramming therapy per company disclosures.
