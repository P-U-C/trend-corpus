notes: Ended 11-year Calico partnership November 2025 over strategy pivot to genetic medicines. Collaboration had grown to up to $3.5B in total potential joint commitments (2014 initial $1.5B; extensions in 2018 and 2021), while AbbVie disclosed $1.75B invested through 2022. Five assets advanced into clinical development (neuroscience and oncology), including fosigotifator (vanishing white matter disease, MDD, failed ALS Phase 2/3 in early 2025) and ABBV-CLS-628 (FDA fast track for autosomal dominant polycystic kidney disease). About 100 employees affected by partnership wind-down. Now adjacent rather than primary.
