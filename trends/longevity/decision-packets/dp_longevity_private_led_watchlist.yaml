id: dp_longevity_private_led_watchlist
question: Should the metalayer maintain a watchlist of BioAge Labs (the sole near-pure-play public name) plus large-cap pharma adjacents (ABBV, GOOGL, LLY, NVO) plus HKEX-listed AI-bio (Insilico Medicine) plus private keystones (Altos, Calico, Loyal, Retro, NewLimit, Life Biosciences, Rejuvenate Bio), tracked against the BGE-102 and APJ IND cadence at BioAge, Life Biosciences' ER-100 safety calendar, the FDA reprogramming-IND calendar, and private-cohort fundraise marks?
verdict: watchlist_candidate
execution_state: human_review_required
supporting_theses:
  - ths_longevity_thin_public_private_led
supporting_claims:
  - clm_longevity_first_reprogramming_inds
  - clm_longevity_public_surface_contracts
  - clm_longevity_private_marks_lead_public
invalidation_conditions:
  - BioAge Labs BGE-102 fails its next pivotal Phase 1 / 2 readout on safety or efficacy or APJ IND submissions slip past 2026 with no replacement candidate, eliminating the sole near-pure-play US-listed catalyst clock.
  - Two or more private-keystone reprogramming or clinical programs (Life Biosciences, Altos, Calico, Retro, NewLimit) report clinical hold, dose-limiting toxicity, or endpoint miss in a 90-day window, collapsing the first reprogramming-clinic catalyst.
  - Alphabet's quarterly earnings / 10-Q / 10-K cadence or Calico's newsroom announces a strategic restructuring or wind-down of Calico Life Sciences after the AbbVie partnership end, signaling that the largest non-pharma corporate sponsor is exiting and effectively ending the credible large-cap acquirer optionality.
  - FDA CBER issues guidance tightening cellular and gene therapy review for the partial-reprogramming approach (for example requiring long-term follow-up above the current 15-year outer bound used for some integrating-vector gene therapies), materially lengthening time-to-commercial-revenue for the private cohort and reducing the leading-indicator value of private marks.
  - A second mega-cap pharma (PFE, BMY, MRK, RHHBY, AZN) takes one of Altos / Calico / NewLimit / Retro out at a control premium below current private-market marks, signaling that strategic value tops out below standalone expectations and re-rating the listed cohort downward.
schema_version: 1
