claim: "On October 26, 2026, Longeveron reported that its 40-infant Phase 2b ELPIS II trial of laromestrocel adjunctive to Stage II palliation for hypoplastic left heart syndrome did not meet its primary 12-month right-ventricular-ejection-fraction endpoint (baseline-adjusted difference \u22121.36 percentage points; p=0.68). In prespecified secondary analyses, the laromestrocel arm recorded 1 major adverse cardiac event versus 8 in standard care (p=0.043) and 3 total major cardiac events versus 22 (rate ratio 0.16; p<0.001); no treatment-related serious adverse events were identified through 12 months."
