claim: "BioAge Labs announced on September 8, 2026 that the first participant was dosed in QUELL-DME, a randomized, controlled Phase 2 trial of once-daily oral BGE-102, its NLRP3 inhibitor, in approximately 180 adults with diabetic macular edema. The trial evaluates BGE-102 90 mg QD as monotherapy and in combination with intravitreal anti-VEGF therapy, with change from baseline in best-corrected visual acuity at week 12 as the primary endpoint."
