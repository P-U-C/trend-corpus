claim: "On October 8, 2026, Life Biosciences reported preliminary Phase 1 data for ER-100, an AAV2 OSK gene therapy using OCT4, SOX2 and KLF4 induction with 56 days of doxycycline, in three open-angle glaucoma participants at 2 \u00d7 10\u00b9\u00b9 vector genomes. Through Day 56, Life Biosciences reported no dose-limiting toxicities, serious adverse events or adverse events of special interest, and reported that two of three participants had Humphrey visual-field sensitivity improvements with at least 28% of tested locations improving by more than 4 dB."
