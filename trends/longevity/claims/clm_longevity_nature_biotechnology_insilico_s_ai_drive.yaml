claim: "On September 7, 2026, Insilico Medicine reported that a Nature Biotechnology study applied six proteomic aging clocks, including ProtAge, OrganAge, PAC, ipfP3GPT, and PAOPAC, to 12-week longitudinal Olink proteomic data from 42 idiopathic pulmonary fibrosis patients in the Phase IIa rentosertib trial NCT05938920. The study reported that all six clocks indicated reduced predicted biological age in rentosertib-treated patients versus placebo, with trial data deposited at CNCB under OMIX008341."
