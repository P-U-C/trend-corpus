claim: "BioAge Labs (NASDAQ: BIOA) reported Q3 2026 collaboration revenue of $0.3 million (vs $2.1 million in Q3 2025), R&D expense of $30.2 million (vs $18.5 million), and a net loss of $33.5 million, or $0.73 per share, with $352.3 million in cash, cash equivalents and marketable securities as of September 30, 2026 and runway guidance through 2029. Its oral NLRP3 inhibitor BGE-102 is in two Phase 2 trials: QUELL-CV, a 160-participant dose-ranging study (30/60/90 mg) in obesity with elevated inflammation using percent change in hsCRP over 12 weeks as primary endpoint, fully enrolled with topline data guided to Q4 2026; and QUELL-DME, an approximately 180-participant trial in diabetic macular edema dosed first in September 2026, with week-12 best-corrected visual acuity as primary endpoint and topline in H2 2027. BioAge guided to its first IND for an APJ agonist obesity program by year-end 2026, and reported that its Deep Origin AI discovery collaboration hit its first milestone in October 2026 with computationally identified hits validated in BioAge's lab. A September 2026 Novartis agreement amendment added $0.9 million of research funding and triggered a $1.7 million cumulative catch-up revenue adjustment."
