claim: "Eli Lilly and Company announced on August 26, 2026 that a retrospective Komodo Healthcare Map claims study of 15,843 U.S. adults over age 55 using Zepbound from November 2023 to September 2025 found lower monthly healthcare costs excluding Zepbound costs versus matched untreated controls. The study reported cost differences of $145-$181 per patient per month at six months and $319-$607 per patient per month at 12 months, with lower hospital admissions and emergency department visits among Zepbound users in the primary analysis."
