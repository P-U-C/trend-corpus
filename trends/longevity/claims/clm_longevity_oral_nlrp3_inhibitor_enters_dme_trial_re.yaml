claim: "On September 8, 2026, Retinal Physician reported that BioAge Labs dosed the first participant in QUELL-DME, a randomized controlled phase 2 trial of oral NLRP3 inhibitor BGE-102 in diabetic macular edema. The approximately 180-adult study assigns participants 1:1:1 to intravitreal anti-VEGF plus placebo, intravitreal anti-VEGF plus BGE-102 90 mg once daily, or simulated intravitreal injection plus BGE-102 90 mg once daily, with 12 weeks of treatment and a week-12 primary endpoint of change in best-corrected visual acuity."
