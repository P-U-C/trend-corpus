id: clm_longevity_public_surface_contracts
claim: The public investable longevity surface contracted materially during 2025. AbbVie ended its 11-year, cumulative $3.5B Calico Life Sciences partnership in November 2025 over a strategy pivot to genetic medicines following Calico fosigotifator ALS Phase 2 endpoint miss earlier in 2025. Unity Biotechnology stockholders approved a liquidation and dissolution plan in September 2025 after UBX1325 narrowly missed the ASPIRE Phase 2b non-inferiority primary endpoint. BioAge Labs remains the lone credible US-listed near-pure-play, navigating its own December 2024 azelaprag pause and 2025 pivot to BGE-102 NLRP3 plus structurally distinct APJ agonists targeting 2026 IND submissions.
