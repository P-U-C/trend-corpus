claim: "BioAge Labs (NASDAQ: BIOA) reported Q3 2026 collaboration revenue of $0.3 million versus $2.1 million in Q3 2025, R&D expense of $30.2 million versus $18.5 million, and a net loss of $33.5 million ($0.73/share) versus $20.2 million ($0.56/share), with $352.3 million in cash, cash equivalents and marketable securities as of September 30, 2026 and a stated runway through 2029. Its oral NLRP3 inhibitor BGE-102 dosed its first participant in September 2026 in QUELL-DME, an approximately 180-participant Phase 2 diabetic macular edema trial randomized 1:1:1 across monotherapy, anti-VEGF combination and control arms with a week-12 best-corrected visual acuity primary endpoint and topline expected in 2H 2027. QUELL-CV, a Phase 2 dose-ranging trial of 30 mg, 60 mg and 90 mg BGE-102 versus placebo in ~160 adults with obesity and elevated inflammation, completed enrollment with a 12-week hsCRP primary endpoint and topline data expected in Q4 2026. BioAge also stated its first APJ agonist IND is planned by year-end 2026, and that in October 2026 its Deep Origin AI discovery collaboration hit its first milestone via lab-validated computational hits; separate collaborations with Novartis (amended September 2026, adding $0.9 million of research funding) and Lilly ExploR&D continued."
