id: clm_longevity_private_marks_lead_public
claim: Private cohort fundraise marks now lead the public revaluation by 12-24 months. NewLimit raised $130M Series B plus $45M follow-on (Eli Lilly, Duke Management, Section 32) at $1.62B valuation. Life Biosciences entered the clinic in 2026 with ER-100, while Altos Labs remains a $3B-initial-funding preclinical cellular-rejuvenation platform. Loyal received FDA reasonable-expectation-of-effectiveness acceptance for LOY-002 in 2025 and had completed two of three major technical sections toward expanded conditional approval by early 2026, with more than $150M raised. Insilico Medicine completed Hong Kong's largest 2025 biotech IPO at approximately $293M as the first AI-driven drug-discovery HKEX listing. Eli Lilly participation in NewLimit follow-on plus its earlier acquisition of Verve Therapeutics (June 2025 cross-listed with synthetic-biology) shows large-cap pharma is actively re-pricing the longevity / cell-and-gene boundary.
