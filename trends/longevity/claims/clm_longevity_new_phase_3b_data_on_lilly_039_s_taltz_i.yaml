claim: "On August 31, 2026, Eli Lilly reported Week 52 exploratory Phase 3b results from TOGETHER-PsO and TOGETHER-PsA evaluating concomitant Taltz (ixekizumab) and Zepbound (tirzepatide) versus Taltz alone in adults with psoriatic disease and obesity or overweight with a weight-related comorbidity. At Week 52, PASI 100 plus at least 10% weight loss was achieved by 30.6% of TOGETHER-PsO patients on Taltz plus Zepbound versus 4.4% on Taltz alone, and ACR50 plus at least 10% weight loss was achieved by 39.2% of TOGETHER-PsA patients on Taltz plus Zepbound versus 1.7% on Taltz alone."
