claim: "On September 30, 2026, Eli Lilly reported Phase 3 ACHIEVE-4 results for Foundayo (orforglipron), its once-daily oral GLP-1 receptor agonist, in 2,749 adults with type 2 diabetes and obesity or overweight at increased cardiovascular risk. Foundayo met the primary non-inferiority objective versus insulin glargine for MACE-4 with hazard ratio 0.84 and 95.0% CI 0.59 to 1.20, and at 52 weeks reduced A1C by 1.6% versus 1.0% for insulin glargine and body weight by 8.8% versus a 1.7% increase for insulin glargine."
