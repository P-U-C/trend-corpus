id: clm_longevity_first_reprogramming_inds
claim: Partial epigenetic reprogramming entered human clinical trials for the first time in 2026 when Life Biosciences received
  FDA clearance for ER-100, an AAV-delivered partial epigenetic reprogramming therapy for optic neuropathies, and initiated
  a Phase 1 first-in-human study. Altos Labs remains a heavily funded preclinical cellular-rejuvenation platform with no publicly
  announced IND clearance as of May 2026. Retro Biosciences began first-in-human dosing of RTR242, an oral autophagy enhancer
  for Alzheimer's disease, but Retro's tissue-reprogramming program remains preclinical. AI-engineered proteins from the Retro
  Biosciences and OpenAI collaboration achieved approximately 50x improvement in expression of stem-cell reprogramming markers.
