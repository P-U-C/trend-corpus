id: clm_longevity_first_reprogramming_inds
claim: Partial epigenetic reprogramming therapies entered human clinical trials for the first time during 2025-2026, marking the regulatory clearance of the first cellular reprogramming INDs ever issued. Altos Labs initiated human trials in neurodegenerative and immune-related aging disorders by 2026. Retro Biosciences began first-in-human dosing of RTR242 (oral autophagy enhancer) for Alzheimer's disease. AI-engineered proteins from the Retro Biosciences and OpenAI collaboration achieved approximately 50x improvement in the performance of key cellular reprogramming factors. Life Biosciences entered the clinic with $80M to support partial-reprogramming AAV programs.
