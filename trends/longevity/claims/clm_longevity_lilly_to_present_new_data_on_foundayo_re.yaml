claim: "Eli Lilly and Company said on September 15, 2026 that it would present EASD 2026 data for Foundayo (orforglipron), retatrutide, eloraTZP, Mounjaro (tirzepatide), and Zepbound (tirzepatide). The disclosed instruments include Phase 3 TRIUMPH-2 results for retatrutide showing up to 49.6 lbs, 22.5 kg, or 20.8% average weight loss and up to 1.6% average A1C reduction at 80 weeks, ACHIEVE-4 results for Foundayo showing non-inferiority versus insulin glargine and MACE-4 HR 0.84 and MACE-3 HR 0.77, and Phase 2 eloraTZP data in adults with obesity or overweight and type 2 diabetes."
