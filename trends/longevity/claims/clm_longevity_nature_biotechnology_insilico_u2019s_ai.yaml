claim: "On September 7, 2026, Insilico Medicine announced a Nature Biotechnology study of rentosertib using 12-week longitudinal Olink proteomic data from 42 idiopathic pulmonary fibrosis patients in its Phase IIa trial, applying six proteomic aging clocks including ProtAge, OrganAge, PAC, ipfP3GPT and PAOPAC. Insilico said all six clocks indicated reduced predicted biological age in rentosertib-treated patients versus placebo, with the strongest reported effect in the 30 mg twice-daily group at Week 4, and said the trial data were deposited at CNCB under accession OMIX008341."
