id: wl_robotics_humanoid_pilot_supply_stack
title: Robotics humanoid pilot and supply-stack watchlist
monitor_for:
  - Figure AI IPO, financing, BMW deployment, and Figure 02 production-readiness updates
  - Tesla Optimus production, internal deployment, bill-of-materials, and factory-use disclosures
  - Commercial pilot counts and customer names for Apptronik, Agility, Sanctuary, Boston Dynamics, and other private humanoid developers
  - Harmonic-drive, actuator, rare-earth magnet, and motor supplier capacity, lead-time, and capex announcements
  - Quarterly robot fleet, procedure, system-start, and revenue metrics from ISRG, SYM, SERV, ABB, TER, and IRBT
  - OSHA, ISO, NIOSH, and standards-body updates affecting collaborative, service, and humanoid robot deployment
