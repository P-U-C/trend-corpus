id: ths_robotics_humanoid_pilot_supply_stack
title: Humanoid robotics trades the pilot-to-supply gap
summary: >
  Humanoid robotics is moving from demo videos into pilot deployments, but
  revenue inflection still depends on actuator cost, precision gearing,
  rare-earth magnet supply, and workplace safety acceptance. Private humanoid
  leaders set the catalyst clock, while public pure plays and automation
  incumbents expose different parts of the stack. The useful watchlist is
  therefore a mix of private-company catalysts, commercial pilot conversion,
  component bottlenecks, and public robotics revenue disclosures.
