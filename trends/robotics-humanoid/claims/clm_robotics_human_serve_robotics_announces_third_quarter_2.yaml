claim: "Serve Robotics Inc. (Nasdaq: SERV) reported Q3 2026 revenue of $2.835 million on November 5, 2026, up 313% from $687 thousand in Q3 2025 but down from $3.238 million in Q2 2026, with a gross loss of $7.555 million and a net loss of $59.23 million ($0.68 per share); recurring revenue was 69% of total. Daily active robots averaged 917 in Q3 2026 versus 312 a year earlier, and cash plus marketable securities stood at $198.0 million as of September 30, 2026 against 87,562,360 shares outstanding. The company raised full-year 2026 revenue guidance to $12 million from $9\u201310 million and lowered non-GAAP operating expense guidance to $150 million from $160\u2013170 million. Serve acquired Diligent Robotics, Inc. in 2026, added 4 hospitals year-to-date with 12 multi-year hospital contract extensions, launched Physical AI Services on November 5, 2026, and launched its first international city in Australia in October 2026."
