claim: "The Association for Advancing Automation (A3) reported that North American companies ordered 10,989 robots valued at $723.5 million in Q3 2026, up 24.8% in units and 26.1% in value versus Q3 2025, bringing first-nine-month 2026 orders to 28,984 units worth roughly $1.89 billion (+9.6% units, +13.3% value). By segment in Q3, Semi & Electronics/Photonics units rose 97.6%, Automotive Component 90.4%, Plastics & Rubber 67.7%, Life Sciences/Pharma/Biomed 38.7%, Metals 37.0%, and Automotive OEM returned to growth at 7.5% while remaining 17% below year-earlier levels through September; Food & Consumer Goods fell 23.7%. Collaborative robot orders reached 1,831 units worth $63.8 million, up about 56% year over year and 16.7% of all units, with 4,605 cobots worth about $178 million ordered through September. A3 cited a September ISM Manufacturing PMI of 54.5, a ninth consecutive expansion month, and Federal Reserve data showing manufacturing output up 0.3% in September."
