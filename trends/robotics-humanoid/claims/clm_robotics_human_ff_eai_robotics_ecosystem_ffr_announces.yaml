claim: "FF EAI Robotics Ecosystem Inc. (NASDAQ: FFR) reported on November 13, 2026 that the robotics business it acquired from Faraday Future Intelligent Electric Inc. (NASDAQ: FFAI) on October 23, 2026 generated approximately $2.3 million in unaudited standalone combined revenue and approximately $593,000 gross profit (about 26% margin) for the nine months ended September 30, 2026, with R&D at 26.2% of operating expenses and no outstanding borrowings or convertible debt as of that date; those results are excluded from FFR's consolidated Q3 2026 figures because the deal closed after quarter end. Consideration was paid in FFR common shares and non-voting convertible preferred shares, with YT Jia as CEO and Jerry Wang as Executive Chairman. FFR disclosed 351 robots sold and shipped in October 2026 and 1,168 cumulative units through end-October, and reaffirmed standalone full-year 2026 guidance of approximately 2,000 robots sold and shipped. FFR also stated its FF OmniMind models ranked first on the RoboColiseum robotics model benchmark as of November 6, 2026, and that it plans to launch its Physical Cloud platform and a Productivity Token around CES."
