claim: "Intuitive Surgical (Nasdaq: ISRG) reported Q3 2026 revenue of $3.05 billion, up 22% from $2.51 billion in Q3 2025, with worldwide da Vinci and Ion procedures up approximately 15% and 546 da Vinci systems placed (315 of them da Vinci 5) versus 427 a year earlier, lifting the da Vinci installed base to 12,094 systems and the Ion installed base to 1,152. GAAP net income fell to $523 million ($1.49 per diluted share) from $704 million ($1.95), reflecting a $450 million pre-tax charge from the October 2026 agreement to settle the \"In re: da Vinci Surgical Robot Antitrust Litigation\" class action for a one-time $450 million payment plus injunctive relief, still subject to court approval; non-GAAP net income was $1.05 billion ($3.00 per diluted share). The company repurchased 7.8 million shares for $2.94 billion and ended the quarter with $6.80 billion in cash, equivalents and investments. Full-year 2026 guidance is 14%-15% da Vinci procedure growth and non-GAAP gross margin of 68.7%-69.3%, including an estimated 0.9%-of-revenue tariff impact."
