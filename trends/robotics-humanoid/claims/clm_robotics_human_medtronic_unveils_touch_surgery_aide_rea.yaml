claim: "Medtronic received FDA clearance for Instrument Exit Point (IEP), the first real-time AI application to run on its new Touch Surgery Aide compute platform for the Hugo robotic-assisted surgery system, unveiled July 21, 2026 ahead of the Society of Robotic Surgery Annual Meeting (July 23-26, Florida). Touch Surgery Aide runs on NVIDIA Holoscan, CUDA, and TensorRT infrastructure; Medtronic's Touch Surgery ecosystem operates in over 1,500 operating rooms worldwide, and the Hugo RAS system, which received FDA clearance for urologic procedures in December 2025, has been used in tens of thousands of procedures across 35+ countries."
