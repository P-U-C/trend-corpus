summary: >
  Tracks public-market exposure to humanoid and embodied robotics: humanoid
  platforms, surgical robotics, warehouse automation, delivery robots,
  collaborative robots, industrial automation, robot components, actuators,
  precision gearing, rare-earth magnets, perception systems, and AI software
  stacks for embodied agents. The theme is growing because private humanoid
  deployment milestones and public robotics pure plays are converging into a
  visible commercial pilot cycle.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain operational
  guidance for autonomous systems, bypass instructions for safety controls,
  deployment instructions for robots in public environments, private order
  intent, account details, or non-public technical data.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
