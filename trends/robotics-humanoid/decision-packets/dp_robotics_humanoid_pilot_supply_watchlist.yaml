id: dp_robotics_humanoid_pilot_supply_watchlist
question: Should the metalayer maintain a watchlist of robotics and humanoid beneficiaries tied to Figure IPO timing, Optimus milestones, commercial pilot conversion, and actuator supply constraints?
verdict: watchlist_candidate
execution_state: human_review_required
supporting_theses:
