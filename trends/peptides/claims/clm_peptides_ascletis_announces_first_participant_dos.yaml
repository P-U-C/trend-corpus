claim: "Ascletis Pharma Inc. announced on August 30, 2026 that the first participant was dosed in its global Phase III AURORA clinical program for ASC30, a once-daily oral small-molecule GLP-1 receptor agonist for chronic weight management. The program includes two pivotal randomized, double-blind, placebo-controlled trials, AURORA-1 (NCT07743463) and AURORA-2 (NCT07743450), enrolling about 4,600 participants in the U.S., Europe, and Canada across 20 mg, 40 mg, and 60 mg maintenance-dose arms over 72 weeks."
