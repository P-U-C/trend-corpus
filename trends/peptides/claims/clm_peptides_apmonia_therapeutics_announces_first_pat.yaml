claim: "On November 12, 2026, Apmonia Therapeutics announced that the first patient had been treated in APM-CT001, a first-in-human Phase 1/2a study of TAX2 (AP-01), a cyclic peptide targeting the TSP-1/CD47 matrix checkpoint. The multicenter France-and-Belgium study evaluates once-weekly intravenous TAX2 monotherapy in patients with advanced or metastatic ovarian, colorectal, or pancreatic cancer or metastatic melanoma, with Phase 1 assessing safety, tolerability, and pharmacokinetics and Phase 2a exploring antitumor activity."
