claim: "Structure Therapeutics (NASDAQ: GPCR) reported Q3 2026 R&D expense of $134.6 million versus $59.0 million in Q3 2025, G&A of $21.8 million versus $14.8 million, and a net loss of $144.8 million versus $65.7 million, with cash, cash equivalents and short-term investments of $1.24 billion at September 30, 2026 (down from $1.3 billion at June 30, 2026 and $1.45 billion at December 31, 2025), stated to fund operations through the end of 2028 excluding pre-commercialization and commercial manufacturing costs. Its Phase 3 ACCOMPLISH program for oral GLP-1 receptor agonist aleniglipron, initiated August 2026, is enrolling up to 3,600 adults (ACCOMPLISH-1) and up to 1,100 adults with type 2 diabetes (ACCOMPLISH-2) across 45 mg, 90 mg and 180 mg maintenance doses, with topline data expected in 2H 2028. In September 2026 the company reported 72-week ACCESS open-label extension results showing up to 16.2% mean body weight reduction in the highest dose group and under 5% discontinuation due to treatment-emergent adverse events. Phase 1 SAD data for oral DACRA ACCG-2671 (1, 2, 5, 10 mg in 31 healthy participants) showed a ~6-day half-life and no serious adverse events; the 84-day MAD portion is dosing with topline data expected in 1H 2027, ACCG-3535 Phase 1 initiation is planned for Q4 2026, and an oral amylin/GLP-1 combination trial for 2027."
