claim: "Kailera Therapeutics (Nasdaq: KLRA) reported Q3 2026 results on November 4, 2026, with R&D expense of $84.7 million (vs $27.0 million in Q3 2025), G&A of $21.7 million, a net loss of $95.7 million, and $1,037.6 million in cash, cash equivalents and marketable securities as of September 30, 2026, funding operations into mid-2028. Its four obesity candidates are ribupatide injection (KAI-9531, GLP-1/GIP dual agonist), ribupatide oral (KAI-9531-T), safiglipron (KAI-7535, oral small molecule GLP-1 agonist), and KAI-4729 (GLP-1/GIP/glucagon tri-agonist). The KaiNETIC Phase 3 program (KaiNETIC-1 NCT07284875, -2 NCT07284901, -3 NCT07284979; ~5,000 participants, doses up to 10 mg over 76 weeks) is fully enrolled with data anticipated mid-2028, while the ~260-participant Phase 2b high-dose trial (NCT07458269; 10/13/16/20 mg over 48 weeks) and the ~300-participant safiglipron Phase 2 trial (NCT07497880) are fully enrolled with data anticipated mid-2027. Kailera completed an End-of-Phase 2 FDA meeting for ribupatide oral and expects to start a two-trial Phase 3 program (up to 25 mg once daily over 60 weeks) in 1H 2027, and has an active IND for KAI-4729 with Phase 1 initiation targeted by end-2026."
