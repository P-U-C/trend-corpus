claim: "On September 21, 2026, Novo Nordisk announced phase 3 topline results for once-weekly CagriSema, a fixed-dose combination of cagrilintide and semaglutide. In REIMAGINE 5, CagriSema 1.0 mg/1.0 mg achieved 12.4% weight loss versus 9.1% for tirzepatide 5 mg at week 60 in adults with type 2 diabetes, with HbA1c reduction of 1.71% versus 1.67%. In REDEFINE 9, CagriSema 1.0 mg/1.0 mg achieved 21.0% weight reduction versus 2.0% for placebo at week 68 in adults with overweight or obesity."
