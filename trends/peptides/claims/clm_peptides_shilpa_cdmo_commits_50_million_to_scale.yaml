claim: "Shilpa CDMO (Shilpa Pharma Lifesciences) announced on 2026-11-03 a $50 million phased investment to add 10 kL of solid-phase peptide synthesis reactor capacity at its Unit-I campus in Raichur, Karnataka, India, citing GLP-1 and complex peptide demand. The first commercial line, opening December 2026 with 500-L and 1000-L reactors, supports up to 1 metric ton of peptide per year and joins 3 existing clinical-phase lines, with commercial supply ramping through 2027; purification includes two 2-m DAC columns with a 10,000-L/h prep HPLC system, 1000-L/h nanofiltration, and a 1000-L lyophilizer. Planned additions of 2-kL, 3-kL, and 5-kL SPPS reactors would bring the site to 6 parallel cGMP lines, one dedicated to cytotoxic peptides, covering SPPS, LPPS, and hybrid routes including lipidation, conjugation, and radioligand peptides. Shilpa named no customers, programs, committed volumes, or per-reactor timelines."
