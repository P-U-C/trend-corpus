claim: "On November 9, 2026, Eli Lilly reported that its Phase 3 ATTAIN-OSA program found once-daily oral small-molecule GLP-1 receptor agonist Foundayo (orforglipron) reduced apnea-hypopnea index by 21.1 events/hour (43.8%) without PAP therapy and 18.3 events/hour (27.5%) with PAP therapy after 52 weeks in adults with moderate-to-severe obstructive sleep apnea and obesity or overweight. Lilly stated that it plans to submit Foundayo to the U.S. FDA for this OSA indication by the end of 2026."
