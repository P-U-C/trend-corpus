claim: "On August 3, 2026, Ascletis Pharma Inc. said once-daily oral small-molecule GLP-1R agonist ASC30 had received U.S. FDA Phase III clearance and that it had initiated the global Phase III AURORA-1 and AURORA-2 trials. The two multicenter, randomized, double-blind, placebo-controlled trials are planned to enroll about 4,600 participants with obesity or overweight in the U.S., Europe, and Canada and test 20 mg, 40 mg, and 60 mg ASC30 maintenance doses over 72 weeks."
