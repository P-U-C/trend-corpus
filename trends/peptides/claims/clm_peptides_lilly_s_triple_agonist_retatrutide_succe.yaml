claim: "On July 23, 2026, Eli Lilly and Company reported that retatrutide, its investigational once-weekly GIP/GLP-1/glucagon triple hormone receptor agonist, met the primary endpoint in the Phase 3 TRIUMPH-2 and TRIUMPH-3 obesity trials. In TRIUMPH-2, adults with obesity or overweight and type 2 diabetes lost up to 49.6 lbs, or 20.8%, at 80 weeks on retatrutide 12 mg, with A1C reductions up to 1.6%; in TRIUMPH-3, adults with severe obesity and established cardiovascular disease lost up to 55.8 lbs, or 22.6%, at 80 weeks on retatrutide 12 mg. Lilly stated it plans to submit a Biologics License Application for retatrutide to the FDA in Q1 2027."
