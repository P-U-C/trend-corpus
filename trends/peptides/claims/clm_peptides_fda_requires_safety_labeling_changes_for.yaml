type: claim
theme_id: peptides
claim: "On November 9, 2026, the U.S. Food and Drug Administration required application holders for all GLP-1 receptor agonists to add a potential risk of non-arteritic anterior ischemic optic neuropathy (NAION) to the Warnings and Precautions section of labeling. FDA\u2019s meta-analysis of 126 randomized controlled trials found 6.4 NAION cases per 100,000 person-years among GLP-1 RA users versus 3.8 per 100,000 person-years among placebo or non-GLP-1 comparator users; affected marketed products include Novo Nordisk\u2019s Ozempic, Rybelsus and Wegovy, Eli Lilly\u2019s Mounjaro and Zepbound, and Eli Lilly\u2019s Foundayo (orforglipron)."
