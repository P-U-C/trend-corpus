claim: "On August 24, 2026, FDA issued Warning Letter CMS #731846 to BioDrive, Inc. CEO Cory A. Henderson concerning Evolv GLP-1 Biomimetic, a dietary supplement labeled as containing Saccharomyces cerevisiae S288C EV-1 Peptide. FDA stated that EV1-Peptide is a new dietary ingredient, that Evolv GLP-1 Biomimetic is adulterated under section 402(f)(1)(B) of the Federal Food, Drug, and Cosmetic Act, and that BioDrive marketed the product despite FDA objections in two new dietary ingredient notifications over inadequate safety information and potential toxicity concerns."
