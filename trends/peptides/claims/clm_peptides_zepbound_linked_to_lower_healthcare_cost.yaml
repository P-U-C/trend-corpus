claim: "Eli Lilly and Company announced on August 26, 2026 that a retrospective observational cohort study using Komodo's Healthcare Map found adults over age 55 with overweight or obesity who sustained Zepbound (tirzepatide) use had lower monthly healthcare costs excluding Zepbound costs than matched untreated adults. The study included 15,843 Zepbound initiators from November 2023 to September 2025 and reported six-month cost differences of $145 to $181 per patient per month and 12-month differences of $319 to $607 per patient per month, depending on analytic method."
