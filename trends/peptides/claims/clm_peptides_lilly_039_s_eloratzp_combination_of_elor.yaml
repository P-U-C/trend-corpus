claim: "On September 30, 2026, Eli Lilly reported 48-week Phase 2b results for EloraTZP, the combination of eloralintide and tirzepatide, in 367 adults with obesity or overweight and type 2 diabetes. The highest-dose EloraTZP arm, eloralintide 9 mg plus tirzepatide 15 mg, produced average body-weight reduction of 54.1 lbs, or 23.3%, and A1C reduction of 2.9%, compared with 34.4 lbs, or 14.8%, and 2.4% A1C reduction for tirzepatide 15 mg alone."
