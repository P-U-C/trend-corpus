claim: "On July 29, 2026, Viking Therapeutics reported that its Phase 3 VANQUISH-1 and VANQUISH-2 trials of subcutaneous VK2735 for obesity were fully enrolled, with VANQUISH-1 enrolling approximately 4,500 adults with obesity by November 2025 and VANQUISH-2 enrolling approximately 1,000 adults with obesity and type 2 diabetes in Q1 2026. Viking also reported that it expected to initiate Phase 3 trials of oral VK2735 in Q4 2026 and that its Phase 1 single ascending dose trial of VK3019, a dual amylin and calcitonin receptor agonist, was underway after FDA IND clearance."
