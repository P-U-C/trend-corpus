claim: "On September 29, 2026, Eli Lilly and Company reported Phase 3 TRIUMPH-2 results for retatrutide, an investigational once-weekly GIP, GLP-1, and glucagon triple hormone receptor agonist, in 1,152 adults with type 2 diabetes and obesity or overweight. At 80 weeks, retatrutide 12 mg produced average body-weight reduction of 20.8% from a 106.4 kg baseline versus 4.0% for placebo, A1C reduction of 1.5% from a 7.7% baseline versus 0.2% for placebo, and adverse-event discontinuation of 7.7% versus 4.9% for placebo."
