claim: "On 9 November 2026, Boehringer Ingelheim reported that its Phase III SYNCHRONIZE-CVOT trial (NCT06077864) of the investigational glucagon/GLP-1 dual agonist survodutide met its primary non-inferiority endpoint for 5P-MACE versus placebo in 5,530 adults with obesity or overweight at elevated cardiovascular risk (HR 0.89; 95% CI 0.67\u20131.18; p<0.0001 for non-inferiority). At 72 weeks, survodutide produced weight loss of up to 13.7% versus 2.0% with placebo under the supplementary secondary estimand; gastrointestinal-event discontinuation rates were 19.3% at 3.6 mg and 20.8% at 6.0 mg, versus 1.9% with placebo."
