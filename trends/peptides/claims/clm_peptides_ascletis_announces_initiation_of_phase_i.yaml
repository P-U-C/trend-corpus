claim: "Ascletis Pharma Inc. announced on September 8, 2026 that it initiated a U.S. Phase I study of ASC36 oral tablets, an oral amylin receptor peptide agonist for obesity, after receiving FDA IND clearance. The trial is designed to evaluate safety, tolerability, pharmacokinetics and pharmacodynamics after single and multiple ascending oral doses in 86 participants with obesity or overweight."
