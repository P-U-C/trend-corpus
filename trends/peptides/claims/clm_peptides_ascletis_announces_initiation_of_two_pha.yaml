id: clm_peptides_ascletis_announces_initiation_of_two_pha
type: claim
theme_id: peptides
claim: "On August 10, 2026, Ascletis Pharma Inc. announced that the U.S. FDA had cleared IND applications for ASC36, a once-monthly to once-quarterly amylin receptor peptide agonist injection, and ASC36_35FDC, a once-monthly fixed-dose subcutaneous co-formulation of ASC36 and the GLP-1R/GIPR peptide agonist ASC35. Ascletis said it had initiated two randomized, double-blind, placebo-controlled Phase I U.S. studies in participants with obesity or overweight with weight-related comorbidities, with ASC36 enrolling 72 participants each for Injection A and Injection B and ASC36_35FDC enrolling 88 participants each for Injection A and Injection B."
