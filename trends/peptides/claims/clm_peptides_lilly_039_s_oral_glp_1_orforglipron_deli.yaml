claim: "Eli Lilly and Company reported on August 7, 2025 that its investigational once-daily oral non-peptide GLP-1 receptor agonist orforglipron met the primary and all key secondary endpoints in the Phase 3 ATTAIN-1 trial of 3,127 adults with obesity or overweight without diabetes. At 72 weeks, orforglipron 36 mg reduced body weight by 12.4% or 27.3 lbs on the efficacy estimand versus 0.9% or 2.2 lbs for placebo, with 59.6% of 36 mg participants losing at least 10% of body weight and 39.6% losing at least 15%."
