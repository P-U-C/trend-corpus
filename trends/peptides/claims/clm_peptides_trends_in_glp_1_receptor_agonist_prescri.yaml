claim: "In Pediatrics on September 4, 2026, Babak J. Orandi et al. reported that an Epic Cosmos retrospective cross-sectional study of 3,520,531 U.S. children ages 8 to 11 with obesity and without diabetes examined GLP-1 receptor agonist prescriptions for Saxenda, Wegovy, and Zepbound from January 1, 2019 to June 17, 2026. The study found GLP-1RA prescribing prevalence increased from 0.03% in 2019 to 9.3% in 2026, and that 0.6% of the cohort received a GLP-1RA prescription."
