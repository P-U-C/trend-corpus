claim: "On November 14, 2026, Amylyx Pharmaceuticals reported that its 78-participant Phase 3 LUCIDITY trial of avexitide, a GLP-1 receptor antagonist, met its primary endpoint in post-bariatric hypoglycemia after Roux-en-Y gastric bypass. During the 16-week double-blind period, avexitide reduced the composite Level 2/3 hypoglycemic event rate by 55% versus placebo (0.55 vs. 1.24 events per week; p=0.0000034); Amylyx stated it planned to submit an NDA by year-end 2026."
