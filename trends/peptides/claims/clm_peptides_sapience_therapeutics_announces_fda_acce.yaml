claim: "On September 14, 2026, Sapience Therapeutics announced that the U.S. FDA accepted IND 184073 for ST316, its first-in-class \u03b2-catenin antagonist, for treatment of familial adenomatous polyposis. Sapience said ST316 previously received FDA Orphan Drug designation for familial adenomatous polyposis and is also being evaluated in an ongoing Phase 2 dose expansion study in second-line metastatic colorectal cancer with FOLFIRI and bevacizumab."
