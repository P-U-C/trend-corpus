claim: "Entera Bio Ltd. reported on August 7, 2026 that the FDA accepted its plan for a single randomized, double-blind, placebo-controlled Phase 3 trial of EB613 in approximately 750 postmenopausal women with osteoporosis, using percent change from baseline in total hip BMD at Month 12 as the primary endpoint to support a potential NDA. Entera said the EB613 NDA package will include a scientific bridge analysis with Eli Lilly\u2019s Forteo under the 505(b)(2) pathway and a transiliac crest bone biopsy sub-study, with Phase 3 initiation planned for late 2026."
