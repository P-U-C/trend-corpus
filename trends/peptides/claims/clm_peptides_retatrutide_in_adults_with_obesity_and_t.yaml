claim: "The Lancet published TRIUMPH-2 on October 10, 2026, reporting an Eli Lilly and Company-funded phase 3 trial registered as ClinicalTrials.gov NCT05929079 that tested once-weekly subcutaneous retatrutide 4 mg, 9 mg, and 12 mg against placebo in 1,152 adults with obesity and type 2 diabetes. At week 80, mean bodyweight change was -11.9% with retatrutide 4 mg, -16.8% with retatrutide 9 mg, -18.8% with retatrutide 12 mg, and -5.1% with placebo; gastrointestinal adverse events were more frequent in the retatrutide groups than placebo, and Eli Lilly funded the study."
