claim: "On August 24, 2026, Hanmi Pharm announced an exclusive licensing agreement with Genentech, a Roche Group member, for worldwide development, manufacturing, and commercialization of HM17321, excluding South Korea. HM17321 is a proprietary UCN2 (urocortin-2) analog for obesity and associated conditions, and Hanmi said it will complete the ongoing Phase 1 trial before Genentech takes over development from Phase 2. Under the agreement, Genentech will pay Hanmi USD 190 million upfront, with total potential deal value up to about USD 2.3 billion including development, regulatory, and commercial milestones, plus tiered royalties on future product sales."
