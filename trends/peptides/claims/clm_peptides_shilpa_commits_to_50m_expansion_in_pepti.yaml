claim: "Indian CDMO Shilpa announced at TIDES Europe 2026 in Amsterdam that it will invest $50 million to expand commercial peptide manufacturing at its 34-acre Raichur, Karnataka campus, which it describes as 100% export oriented and adjacent to its API site. The new GMP facility has reactors up to 1,000 liters, supporting up to one metric ton of annual output, plus nanofiltration purification and a large-scale lyophilizer platform. CEO Keshav Bhutada attributed the investment to rising demand for peptide therapies including GLP-1s, and said the commercial line is on track to open in December 2026. Senior VP Dipak Kalita said route selection spans solid-phase, liquid-phase, or hybrid synthesis, and the center will build on Shilpa's existing cytotoxic and peptide conjugate payload lines."
