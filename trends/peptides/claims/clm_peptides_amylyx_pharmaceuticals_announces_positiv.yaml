claim: "On August 18, 2026, Amylyx Pharmaceuticals, Inc. announced that its 78-participant Phase 3 LUCIDITY trial of avexitide in post-bariatric hypoglycemia met the FDA-agreed primary endpoint, with avexitide reducing the composite rate of Level 2 and Level 3 hypoglycemic events by 55% versus placebo (p=0.000003). Amylyx stated that avexitide is an investigational first-in-class GLP-1 receptor antagonist with FDA Breakthrough Therapy Designation for post-bariatric hypoglycemia and that the company plans to submit an NDA to the FDA by the end of 2026."
