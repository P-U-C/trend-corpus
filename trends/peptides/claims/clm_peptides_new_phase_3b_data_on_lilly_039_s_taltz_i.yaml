claim: "On August 31, 2026, Eli Lilly reported 52-week Phase 3b TOGETHER-PsO and TOGETHER-PsA data for concomitant Taltz (ixekizumab) and Zepbound (tirzepatide) versus Taltz alone in adults with psoriatic disease and obesity or overweight. At Week 52, TOGETHER-PsO showed PASI 100 plus at least 10% weight loss in 30.6% of Taltz-plus-Zepbound patients versus 4.4% on Taltz alone, while TOGETHER-PsA showed ACR50 plus at least 10% weight loss in 39.2% versus 1.7%; Lilly also reported no new safety concerns."
