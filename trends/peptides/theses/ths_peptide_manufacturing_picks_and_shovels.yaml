id: ths_peptide_manufacturing_picks_and_shovels
title: Peptide manufacturing is the cleaner picks-and-shovels exposure
summary: >
  In the public market, specialized peptide-API manufacturing capacity and
  associated quality infrastructure are more durable exposures to the obesity-
  drug cycle than originator-pharma equities. The cycle's main constraint is
  supply, the supply-side capacity announcements are observable in primary IR,
  and the CDMO names trade with less franchise-headline-risk than the
  originators. Compounding-pharmacy channels are a second-order beneficiary
  whose value is contingent on FDA shortage-status.
supporting_claims:
  - clm_glp1_manufacturing_capacity_bottleneck
  - clm_fda_compounding_enforcement_shift
  - clm_telehealth_compounded_glp1_volume
