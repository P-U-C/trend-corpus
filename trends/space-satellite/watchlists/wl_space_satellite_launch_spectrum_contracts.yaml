id: wl_space_satellite_launch_spectrum_contracts
title: Space-satellite launch, spectrum, and contract-flow watchlist
monitor_for:
  - SpaceX Falcon launch cadence, Starship test flights, Starlink direct-to-cell satellite deployments, and Starship reusability milestones
  - Rocket Lab Electron / HASTE mission cadence, Neutron qualification and first-launch timing, and spacecraft backlog disclosures
  - AST SpaceMobile BlueBird launch cadence, FCC / international SCS approvals, carrier commercial-service announcements, and MNO revenue milestones
  - FCC spectrum proceedings touching SCS, V-band, E-band, Ka-band, launch communications, and ITU coordination requirements
  - NRO commercial earth-observation awards, EOCL renewals, CSO awards, and commercial imagery task-order expansions
  - DOD Commercial Space Strategy implementation, SDA tranche awards, PWSA transport / tracking layer milestones, and CASR-related commercial-satellite procurement
  - NASA CLPS task orders, Lunar Terrain Vehicle Services, Near Space Network Services, and lunar delivery outcomes for Intuitive Machines and Firefly
  - Phased-array antenna, RF ASIC, optical terminal, solar-array, propulsion, and ground-system bottlenecks called out by ASTS, RKLB, KTOS, LHX, and suppliers
schema_version: 1
