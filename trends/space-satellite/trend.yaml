summary: >
  Tracks public-market exposure to commercial space infrastructure: launch
  services and spacecraft manufacturing (Rocket Lab, SpaceX, Firefly), direct
  to device and satellite broadband (AST SpaceMobile, Iridium, Globalstar,
  Viasat, EchoStar / Hughes), earth-observation imagery and analytics (Planet,
  Maxar), lunar transport and cislunar infrastructure (Intuitive Machines), and
  national-security satellite ground and integration work (Kratos, L3Harris,
  Lockheed Martin, Northrop Grumman). The theme is growing because FCC
  Supplemental Coverage from Space approvals, commercial launch cadence,
  SDA / NRO / NASA contract flow, and D2D broadband service activation are
  turning space infrastructure into a recurring revenue and capacity-allocation
  market rather than only a project-finance cycle.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain launch operations
  procedures, spacecraft control details, restricted technical data, classified
  national-security payload information, private order intent, account details,
  or non-public government acquisition information.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
