theme_id: space-satellite
claim: "On October 8, 2026, the FCC released a draft Notice of Proposed Rulemaking to modernize its Supplemental Coverage from Space (SCS) rules, first adopted in 2024, and facilitate direct-to-device satellite service; the draft was circulated for the FCC's October 29, 2026 Open Meeting. The draft would make more than 482 megahertz of spectrum available for SCS by rule and raise the number of eligible bands from five to thirteen, relax leasing requirements where a terrestrial licensee lacks all licenses across a geographically independent area, and eliminate waivers where a satellite licensee itself holds SCS-eligible terrestrial spectrum. To date all approved SCS deployments have relied on waivers of the FCC's rules. The FCC also seeks comment on D2D performance requirements for SCS and MSS operators and interference-related technical rules, with comments due 60 days after Federal Register publication if adopted."
