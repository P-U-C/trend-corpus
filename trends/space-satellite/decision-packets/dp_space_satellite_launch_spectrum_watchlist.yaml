invalidation_conditions:
  - SpaceX Starship reaches operational reusability with sub-50-dollar-per-kilogram launch cost, collapsing margin for incumbent launch providers and reducing public launch-provider pricing power.
  - FCC blocks AST SpaceMobile BlueBird constellation deployment past Block 2 or imposes operating conditions that prevent commercial SCS service beyond limited emergency or trial use.
  - Direct-to-device commercial revenue stays below 1 billion dollars aggregate annual through 2027 despite multiple operators launching service.
  - Earth-observation pricing pressure from SAR small-sats and hyperspectral competitors collapses Planet Labs ARPU more than 30 percent in 12 months.
  - NRO, SDA, or NASA materially reduces commercial space contract vehicles for two consecutive award cycles, shifting demand back to legacy cost-plus prime channels.
