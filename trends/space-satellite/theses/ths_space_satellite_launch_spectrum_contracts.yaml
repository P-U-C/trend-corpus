id: ths_space_satellite_launch_spectrum_contracts
title: Space-satellite revalues on launch cadence, spectrum access, and government contract flow
summary: >
  Space-satellite is a three-clock sector. The fast clock is launch and
  deployment cadence: SpaceX Falcon / Starship, Rocket Lab Electron / Neutron,
  AST BlueBird launches, and Firefly CLPS missions create visible capacity
  milestones. The regulatory clock is FCC SCS, ITU coordination, and country by
  country direct-to-device approvals; this is the gating variable for ASTS,
  Starlink, Iridium, and Globalstar. The contract-flow clock is government
  demand: NRO commercial imagery, SDA proliferated constellations, DOD
  commercial space integration, and NASA CLPS / cislunar awards. Public pure
  plays (ASTS, RKLB, PL, LUNR) carry the highest beta because each has a clear
  catalyst-to-revenue bridge. Mature satcom operators (IRDM, VSAT, GSAT, SATS)
  provide lower-beta exposure to spectrum and connectivity revenue. Defense
  primes (LHX, LMT, NOC) capture contract dollars but dilute the signal inside
  larger portfolios. The useful watchlist combines launch cadence, FCC spectrum
  milestones, satellite production bottlenecks, and government award flow.
