id: ths_bci_neurotech_private_clinical_clock
title: BCI / neurotech revalues on private clinical progress before public pure plays exist
summary: >
  BCI / neurotech is a private-keystone sector with public-market adjacents.
  The first clock is regulatory: IDE approvals, Breakthrough Device
  designation, 510(k) clearances, and ClinicalTrials updates are more useful
  than product-launch language because implants and neuromodulation devices
  must move through medical-device gates. The second clock is clinical:
  channel count, decoder throughput, adverse events, durability, and patient
  independence outcomes determine whether Neuralink, Synchron, Paradromics,
  Precision, Blackrock, CorTec, and BrainGate-derived systems can become
  commercial devices. The third clock is private-market capital formation:
  Neuralink, Synchron, Paradromics, Precision, Blackrock, and Merge Labs
  valuation marks will probably precede public pure-play listings by multiple
  quarters. Public exposure is therefore mostly adjacent: BSX, MDT, ABT, LIVN,
  and ONWD capture neuromodulation revenue, while BFLY and QSI are ambiguous
  enabling-technology seeds. The useful watchlist combines FDA status, patient
  count, clinical throughput, private fundraises, and incumbent acquisition
  behavior.
