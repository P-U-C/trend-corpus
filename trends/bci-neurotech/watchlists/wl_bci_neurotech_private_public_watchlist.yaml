id: wl_bci_neurotech_private_public_watchlist
title: BCI / neurotech private clinical and public incumbent watchlist
monitor_for:
  - Neuralink PRIME study patient count, trial-site additions, adverse-event disclosures, explants, and new indication studies
  - Synchron COMMAND readout calendar, FDA conversations, pivotal-trial design, and endovascular implant durability updates
  - Paradromics Connect-One enrollment, Connexus speech-restoration milestones, Precision Layer 7 regulatory updates, Blackrock MoveAgain commercialization steps, and CorTec Brain Interchange progress
  - Merge Labs, Neuralink, Synchron, Paradromics, Precision, Blackrock, and CorTec fundraise valuation marks, IPO filings, and strategic-investor participation
  - FDA Breakthrough Device, IDE, 510(k), PMA, EU MDR, and post-market surveillance updates for neural interfaces and neuromodulation systems
  - BSX, MDT, ABT, LIVN, and ONWD quarterly neuromodulation growth, DBS / VNS / SCS launches, and BCI-linked acquisition behavior
  - BFLY Forest / ultrasound-on-chip milestones and QSI protein-sequencing developments that plausibly connect to neurotech or brain proteomics
  - Peer-reviewed channel-count, decoder-throughput, word-error-rate, durability, and patient-independence records for intracortical, surface, endovascular, and non-invasive BCI approaches
schema_version: 1
