claim: "Cognixion Corporation announced on November 4, 2026 that it is enrolling 30 U.S. adults with ALS in the NIH/NIDCD-funded CHOICE study (ClinicalTrials.gov NCT07871071; award R44DC023888) of its investigational wearable brain\u2013computer interface communication device. Over 12 weeks, participants will use their own eye-tracking speech-generating tablet, Cognixion\u2019s head-worn BCI with augmented-reality display glasses, and a touchscreen version; voluntary time spent using each option is the primary outcome measure."
