claim: "ONWARD Medical N.V. (Euronext: ONWD; OTCQX ADR: ONWRY) reported EUR 2.5M total Q3 2026 revenue, of which EUR 2.0M came from ARC-EX system sales and paid evaluations, with 88 ARC-EX Systems sold or supplied in the quarter (120% year-over-year unit growth) and availability in more than 170 clinics worldwide including 150 US rehabilitation clinics and VA facilities; most Q3 units were intended for home use. Cash stood at EUR 73.4M as of September 30, 2026, after the company signed a financing agreement for up to EUR 50M with funds and accounts managed by BlackRock and drew EUR 20M at closing to repay and retire its prior Runway Growth Capital LLC facility. In the ARC-IM pipeline, the Empower BP global pivotal study for blood pressure instability after spinal cord injury had 31 participants enrolled and 16 sites recruiting in the US, Canada, and Germany, while first implants occurred in the EIGER mobility study (chronic and subacute cohorts, at SPZ Nottwil and CHUV Lausanne) and first-in-human ARC-IM use for bladder control in the ReeVoid study at CHUV. ARC-IM and ARC-BCI remain investigational; only ARC-EX is cleared for commercial sale in the US and Europe."
