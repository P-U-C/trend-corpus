claim: "On 2026-10-26 Austin-based Paradromics announced FDA approval of a protocol amendment for its Connect-One Early Feasibility Study of the Connexus brain-computer interface, removing the requirement that participants live within a four-hour drive of a clinical site and allowing nationwide recruitment. Enrollment runs through three U.S. academic medical centers\u2014University of Michigan, UC Davis, and Massachusetts General Hospital\u2014with David Brandman of UC Davis Health as lead principal investigator. The Connexus device received an FDA investigational device exemption in November 2025, and Paradromics completed its first long-term human implantation in June 2026; the study period is six years."
