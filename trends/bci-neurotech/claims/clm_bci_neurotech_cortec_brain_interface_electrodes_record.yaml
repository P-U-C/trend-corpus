claim: "CorTec reported that its micro-ECoG cortical-surface electrode arrays implanted in two non-human primates at Weill Cornell Medicine recorded neural signals for more than four years. In the animal still under study, 63 of 64 contacts remained recording after more than four years; across both animals, one contact failed after about 14 months. CorTec stated that spatial and spectral signal characteristics remained stable through day 1,361 and that the arrays distinguished alert task-engaged from drowsy brain states."
