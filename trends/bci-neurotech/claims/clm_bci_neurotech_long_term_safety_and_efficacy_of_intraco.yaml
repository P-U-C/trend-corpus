claim: "In the Science Translational Medicine article published July 15, 2026, Charles M. Greenspon, Taylor G. Hobbs, Ceci Verbaarschot and coauthors reported early feasibility trial NCT01894802, in which five spinal-cord-injury participants each received two Blackrock NeuroPort microelectrode arrays in Brodmann area 1. The study delivered more than 168 million intracortical microstimulation pulses across 27 combined implant-years, with implant durations of 2 to 10 years, and reported no serious ICMS-related adverse events or direct negative effects on electrode health."
