claim: "On November 5, 2026, Cognixion announced the NIH/NIDCD-funded CHOICE Study (NCT07871071), a 12-week longitudinal study planned to enroll 30 U.S. adults with ALS. The study compares participants\u2019 existing eye-tracking speech-generating devices, including Tobii Dynavox or Smartbox systems, with head-worn and screen-based configurations of Cognixion\u2019s investigational non-invasive BCI, Cognixion ONE; its primary outcome is participants\u2019 voluntary time using each option. The first budget year is funded entirely by NIDCD Award R44DC023888 for $1,258,551."
