claim: "On September 16, 2026, News-Medical reported a Nature Neuroscience study by Brosler, Liu, Silva, Hallinan, Kurtz-Miott, Dunkel Wilker, Tu-Chan, Ganguly, and Edward F. Chang showing that a single 253-electrode high-density ECoG implant in the BRAVO clinical trial decoded attempted speech and gestures concurrently in two people with severe paralysis. The system used participant-specific convolutional recurrent neural network decoders and a personalized full-body virtual avatar; in real-time concurrent decoding, Bravo-6 reached 66.0% gesture accuracy and 70.0% speech accuracy, while structured conversation testing reached 85.0% gesture and 75.0% speech accuracy for Bravo-6 and 100.0% median accuracy for both modalities in Bravo-1r."
