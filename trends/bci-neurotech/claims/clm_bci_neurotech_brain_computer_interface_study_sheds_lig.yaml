claim: "On September 23, 2026, Brown University reported that BrainGate clinical trial researchers at Brown University, Brown\u2019s Carney Institute for Brain Science, Mass General Brigham Center for Neurotechnology and Neurorecovery, and the VA Center for Neurorestoration and Neurotechnology used intracortical electrode arrays in two people with tetraplegia to record motor-cortex neuron activity during observed hand-like actions. The study, published in Proceedings of the National Academy of Sciences, found stronger observational neural activity for realistic human hands than for an anthropomorphic robot hand, a three-pronged robot claw, or a cube, while attempted grip conditions produced similar activity across effectors."
