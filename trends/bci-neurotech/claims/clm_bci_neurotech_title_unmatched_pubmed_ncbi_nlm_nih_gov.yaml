claim: "In a prospective single-centre study at Columbia University Medical Center and NewYork-Presbyterian Hospital, Qi Shen and colleagues tested a real-time EEG brain-computer interface in 41 clinically unresponsive patients with acute brain injury. Thirteen of 41 patients (32%) achieved control of the tone-modulating BCI; 4 of 13 (31%) with BCI control versus 1 of 28 (4%) without control recovered consciousness by hospital discharge, and 6 of 13 (46%) versus 2 of 28 (7%) recovered functional independence at 12 months."
