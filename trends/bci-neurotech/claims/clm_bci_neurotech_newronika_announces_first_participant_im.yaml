claim: "Newronika S.p.A. announced on September 30, 2026 that the first participant in its ADVENT pivotal study received the \u03b1DBS\u00ae implant on September 21, 2026 at Hospital Fondazione IRCCS San Gerardo dei Tintori in Monza. ADVENT, registered as NCT06891781, is a prospective, multicenter, randomized, double-blind crossover study comparing adaptive and conventional deep brain stimulation delivered by Newronika\u2019s \u03b1DBS\u00ae system in 104 adults with idiopathic Parkinson\u2019s disease, and is intended to support a future U.S. Premarket Approval application."
