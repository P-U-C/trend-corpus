summary: >
  Tracks public-market and private-market exposure to brain-computer interfaces
  and adjacent neuromodulation: private implantable or minimally invasive BCI
  keystones (Neuralink, Synchron, Paradromics, Precision Neuroscience,
  Blackrock Neurotech, Merge Labs, CorTec), academic clinical infrastructure
  (BrainGate), public neuromodulation incumbents (Boston Scientific,
  Medtronic, Abbott, LivaNova, ONWARD Medical), and ambiguous scanner seeds
  tied to enabling technologies rather than direct BCI revenue (Butterfly
  Network ultrasound-on-chip, Quantum-Si proteomics). The theme is emerging
  because FDA IDE / Breakthrough Device pathways, first-human and early
  feasibility studies, private valuation marks, and channel-count /
  throughput benchmarks are moving ahead of any public pure-play BCI cohort.
public_safety_boundary: >
  This theme is limited to public research, market intelligence, and
  watchlist-candidate thesis generation. It must not contain surgical
  instructions, implant programming parameters, patient-identifiable data,
  device cybersecurity exploit details, non-public clinical-trial information,
  private order intent, account details, or non-public acquisition information.
primary_use_cases:
  - research
  - market_intelligence
  - trade_thesis_generation
