invalidation_conditions:
  - Neuralink first-human-implant adverse event causes FDA to pull or pause the PRIME study.
  - Synchron's COMMAND follow-on or pivotal study readout fails its primary endpoint by more than 50 percent versus prespecified success criteria.
  - Public BCI IPO calendar slips past 2027 with no replacement catalyst, including no Neuralink filing, no Synchron filing, and no Merge Labs emergence.
  - Boston Scientific or Medtronic makes a 5-billion-dollar-plus DBS-side acquisition before any pure-play BCI IPO, signaling sector consolidation and reducing the addressable independent pure-play universe.
  - Published BCI throughput records fail to improve for 24 months while adverse-event or explant disclosures rise across at least two leading implantable platforms.
